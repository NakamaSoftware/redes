<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Interfaz de ejemplo «terminal-claude» para la pantalla en 3D (versión Reel): una terminal con Claude Code que edita el
     reel del día con la skill editar-reels-claude. El pedido se escribe, salen las herramientas una a una, la barra de render
     llega al 100 % y aparece la vista previa del reel (9:16) a la derecha, que en 3D sale hacia la cámara.
     `node scripts/render.mjs pantalla terminal-claude` → obj.pantalla('../pantallas/terminal-claude'). -->
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<style>
  .term { position: absolute; inset: 0; background: #0E0D10; font-family: var(--mono); font-size: 26px; line-height: 1.5; color: var(--texto); }
  .barra { position: absolute; left: 0; top: 0; width: 1400px; height: 54px; background: #18161B; border-bottom: 1px solid rgba(255,255,255,.06); }
  .punto { position: absolute; top: 19px; width: 16px; height: 16px; border-radius: 50%; }
  .linea { position: absolute; left: 44px; white-space: nowrap; }
  .gris { color: var(--mute); }
  .coral { color: var(--acento2); }
  .verde { color: #7FD6A0; }
</style>
</head><body>
<script>
escena({ duracion: 10, ancho: 1400, alto: 1000 }, (MG) => {
  const T = MG.el('<div class="term"></div>');
  MG.el(`<div class="barra"><div class="punto" style="left:22px;background:#FF5F57"></div><div class="punto" style="left:48px;background:#FEBC2E"></div>
    <div class="punto" style="left:74px;background:#28C840"></div>
    <div class="gris" style="position:absolute;left:0;width:1400px;top:12px;text-align:center;font-size:20px">claude — ~/Videos/Viegas Estudio/reel-octubre</div></div>`, T);
  MG.el(`<div style="position:absolute;left:44px;top:84px;width:640px;height:108px;border:2px solid var(--acento);border-radius:12px">
    <div style="position:absolute;left:24px;top:14px;font-weight:700"><span class="coral">✻</span> Bienvenido a <b>Claude Code</b></div>
    <div class="gris" style="position:absolute;left:24px;top:56px;font-size:21px">/help para ayuda · cwd: ~/reel-octubre</div></div>`, T);
  const pedido = 'edita el reel de hoy con editar-reels-claude';
  const prompt = MG.el(`<div class="linea" style="top:228px"><span class="coral">&gt;</span> <span></span></div>`, T);
  // herramientas: [segundo, línea principal, resultado]
  const pasos = [
    [1.7, '● Read(<b>cam-2026-10-22.mp4</b>)', 'Leído · 3:12 · 4K 60 fps'],
    [2.4, '● Bash(<b>transcribir con Whisper</b>)', '512 palabras · español'],
    [3.1, '● Bash(<b>quitar silencios</b>)', '42 silencios · 3 falsos inicios'],
    [3.8, '● Write(<b>subtitulos.ass</b>)', 'palabra a palabra · zona segura'],
  ];
  const lineas = pasos.map(([, a, b], i) => {
    const l1 = MG.el(`<div class="linea" style="top:${298 + i * 104}px"><span class="coral">${a.slice(0, 1)}</span>${a.slice(1)}</div>`, T);
    const l2 = MG.el(`<div class="linea gris" style="top:${340 + i * 104}px;left:76px">⎿ ${b}</div>`, T);
    return [l1, l2];
  });
  const render = MG.el(`<div class="linea" style="top:722px">Renderizando 4K <span style="display:inline-block;vertical-align:-6px;width:300px;height:28px;border-radius:6px;background:#26232A;overflow:hidden;margin:0 14px"><span style="display:block;height:100%;width:0;background:var(--acento)"></span></span><span>0 %</span></div>`, T);
  const barra = render.children[0].firstChild, pct = render.children[1];
  const listo = MG.el(`<div class="linea verde" style="top:800px;font-weight:700">✓ Reel listo · reel-final.mp4 · 0:47 · −14 LUFS</div>`, T);
  const cursor = MG.el(`<div class="linea" style="top:868px"><span class="coral">&gt;</span> <span style="display:inline-block;width:14px;height:30px;vertical-align:-6px;background:var(--texto)"></span></div>`, T);

  // desde el principio: el hueco de la vista previa esperando el render y la barra de estado de abajo (la terminal nunca está vacía)
  const espera = MG.el(`<div style="position:absolute;left:1010px;top:190px;width:350px;height:622px;border-radius:18px;border:2px dashed rgba(255,255,255,.16);
    background:repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 18px, transparent 18px 36px)">
    <div style="position:absolute;left:0;top:262px;width:350px;text-align:center;font-size:22px" class="gris">vista previa</div>
    <div style="position:absolute;left:151px;top:318px;width:48px;height:48px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:var(--acento)"></div></div>`, T);
  const giro = espera.lastElementChild;
  MG.el(`<div style="position:absolute;left:0;top:940px;width:1400px;height:60px;background:#141217;border-top:1px solid rgba(255,255,255,.06)">
    <div class="linea" style="top:12px;font-size:21px"><span class="coral">⏵⏵ modo auto</span><span class="gris"> · Opus · skill: editar-reels-claude · contexto 12 %</span></div></div>`, T);
  // vista previa del reel (9:16) a la derecha: aparece cuando termina el render
  const tarjeta = MG.el(`<div style="position:absolute;left:1010px;top:190px;width:350px;height:622px;border-radius:18px;overflow:hidden;font-family:var(--fuente);
    background:radial-gradient(80% 45% at 50% 100%, rgba(217,119,87,.65), transparent 70%), linear-gradient(170deg,#2b1e3d,#110e15);box-shadow:0 0 0 2px rgba(255,255,255,.08)"></div>`, T);
  const t1 = MG.el(`<div class="mg-abs mg-titulo" style="left:0;top:180px;width:350px;text-align:center;font-size:58px">EDITA</div>`, tarjeta);
  const t2 = MG.el(`<div class="mg-abs mg-titulo" style="left:0;top:246px;width:350px;text-align:center;font-size:58px"><em>MENOS.</em></div>`, tarjeta);
  const subs = MG.el(`<div class="mg-abs" style="left:0;top:440px;width:350px;display:flex;justify-content:center;gap:8px">${['Claude', 'lo', 'edita'].map((w) => `<span style="background:#F4F2EE;color:#141217;font-weight:800;font-size:24px;padding:6px 12px;border-radius:999px">${w}</span>`).join('')}</div>`, tarjeta);
  const reproduccion = MG.el(`<div class="mg-abs" style="left:24px;top:580px;width:302px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)"><div style="height:100%;width:0;border-radius:3px;background:var(--acento)"></div></div>`, tarjeta);
  const etiqueta = MG.el(`<div class="linea gris" style="top:840px;left:1010px;font-size:20px">vista previa · 1080 × 1920</div>`, T);

  const cv = MG.curvas, k = MG.k;
  return (t) => {
    const n = Math.round(pedido.length * cv.suave(k(t, 0.25, 1.4)));
    prompt.lastChild.textContent = pedido.slice(0, n) + (t < 1.6 && Math.floor(t * 4) % 2 ? '▌' : '');
    pasos.forEach(([t0], i) => { const [a, b] = lineas[i];
      const e = MG.entra(a, t, t0, { dy: 24, d: 0.45 }); MG.pon(a, 0, e.y);
      const f = MG.entra(b, t, t0 + 0.25, { dy: 18, d: 0.45 }); MG.pon(b, 0, f.y); });
    const er = MG.entra(render, t, 4.5, { dy: 24, d: 0.45 }); MG.pon(render, 0, er.y);
    const p = cv.entradaSalidaQuint(k(t, 4.7, 7.1)); barra.style.width = 300 * p + 'px'; pct.textContent = Math.round(100 * p) + ' %';
    const el = MG.entra(listo, t, 7.2, { dy: 24, d: 0.45 }); MG.pon(listo, 0, el.y);
    cursor.style.opacity = t > 7.9 ? (Math.floor(t * 2) % 2 ? 1 : 0.2) : 0;
    // la tarjeta del reel entra con rebote y empieza a «reproducirse»
    giro.style.transform = `rotate(${t * 300}deg)`; espera.style.opacity = 1 - MG.k(t, 7.4, 7.8);
    const et = MG.entra(tarjeta, t, 7.4, { dy: 60, escala0: 0.9, d: 0.6 }); MG.pon(tarjeta, 0, et.y, et.s);
    const eq = MG.entra(etiqueta, t, 7.6, { dy: 20, d: 0.45 }); MG.pon(etiqueta, 0, eq.y);
    const z = 1 + 0.05 * k(t, 7.4, 10); t1.style.transform = t2.style.transform = `scale(${z})`;
    [...subs.children].forEach((s, i) => { const e = MG.entra(s, t, 8.0 + i * 0.25, { dy: 26, d: 0.45 }); MG.pon(s, 0, e.y, e.s); });
    reproduccion.firstChild.style.width = 302 * k(t, 7.8, 10) + 'px';
  };
});
</script>
</body></html>
