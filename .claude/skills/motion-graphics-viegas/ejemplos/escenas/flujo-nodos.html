<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Ejemplo «flujo-nodos» · Motion Graphics Viegas. Diagrama de nodos de cristal: herramienta → 3 pasos con ✓ en secuencia → resultado; la cámara recorre el flujo.
     Sacado del vídeo de YouTube «Carruseles animados con Claude Code» (Viegas Estudio, 22-10-2026).
     Cambia textos, tarjetas (vid/…) y tiempos; la curva, el desenfoque y la cámara ya siguen la guía de estilo. -->
<link rel="stylesheet" href="../motor/estilo.css">
<link rel="stylesheet" href="ejemplos.css">
<script src="../motor/motor.js"></script>
</head><body>
<script>
escena({ duracion: 8.45, ancho: 1920, alto: 1080, fondo: 'marca' }, (MG) => {
  // --- compatibilidad con las funciones del vídeo original (mismos nombres, sobre el motor) ---
  const M = MG.mundo, V = MG.vista, DT = MG.DT, MB = MG.MB, SVGNS = 'http://www.w3.org/2000/svg';
  const { k, lerp, cl, desenfoca, pon, camara: camara0 } = MG;
  const C = MG.curvas, quint = C.salidaQuint, inOut = C.entradaSalidaQuint, suave = C.suave, back = (x) => C.atras(x), rebote = C.rebote, reboteSuave = C.reboteSuave;
  const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
  const entra = (el, t, t0, d = .7, dx = 0, dy = 220, s0 = .94, base = 3, extra = 0) => MG.entra(el, t, t0, { d, dx, dy, escala0: s0, base, extra });
  const camara = (t, z0, z1, ox = 960, oy = 540) => camara0(t, z0, z1, ox, oy);
  const VID = (e, n) => `vid/${String(e).padStart(2, '0')}-${n}.mp4`;
  const VIDS = { push: (o) => MG.registrar(o.v, o) };
  function tarjeta(src, w, h, t0, off = .8, bucle = false) { return MG.tarjeta(src, w, h, t0, { desde: off, bucle: true }); }
  function logoClaude(tam) {
    const w = $(`<div class="abs" style="width:${tam}px;height:${tam}px"><div class="logo abs" style="width:100%;height:100%;filter:drop-shadow(0 0 40px rgba(var(--halo),.55))"></div><div class="barrido abs" style="width:100%;height:100%"></div></div>`);
    w.barre = (x) => { w.children[1].style.backgroundPosition = `${lerp(110, -10, x)}% 0`; w.children[1].style.opacity = x > 0 && x < 1 ? 1 : 0; };
    return w;
  }
  
  let pinta = () => {}; let DUR = 8.45;
  DUR = 8.45;
  const svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('class', 'lineas'); svg.setAttribute('width', 3000); svg.setAttribute('height', 1200); M.appendChild(svg);
  const linea = (d) => { const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none');
    p.style.stroke = 'var(--acento)'; p.setAttribute('stroke-width', 3); p.setAttribute('stroke-linecap', 'round'); svg.appendChild(p); const L = p.getTotalLength();
    p.style.strokeDasharray = L; p.dibuja = (x) => { p.style.strokeDashoffset = L * (1 - x); p.style.opacity = x > 0 ? 1 : 0; }; return p; };
  const Y = 540;
  const n1 = $(`<div class="nodo abs"><div class="ic"><img src="claude-code-logo.svg"></div><div><b>Skill · carrusel-animado</b><small>la preparé para ti · Opus 5.5</small></div></div>`); M.appendChild(n1);
  const herr = [['HTML', 'las animaciones de cada slide'], ['Playwright', 'fotografía cada fotograma'], ['FFmpeg', 'los MP4 con sonido y música']]
    .map(([b, s]) => { const n = $(`<div class="nodo abs"><div class="ic" style="background:var(--superficie)"><span style="font-weight:800;color:var(--acento);font-size:22px">${b[0]}</span></div><div><b>${b}</b><small>${s}</small></div><div class="ck"></div></div>`); M.appendChild(n); return n; });
  const res = $(`<div class="abs" style="width:760px"><div class="nodo" style="display:inline-flex"><div class="ic" style="background:var(--acento)"><span style="font-size:30px;color:var(--tinta);font-weight:800">✓</span></div><div><b>Carrusel listo</b><small>slides animados · con sonido</small></div></div></div>`); M.appendChild(res);
  const sl = [1, 2, 3, 4, 5].map((n, i) => tarjeta(VID(10, n), 200, 250, 5.7 + i * .1, .9));
  const PX = 700, PY = [Y - 175, Y, Y + 175], J1 = 540, J2 = 1330, PR = [1480, Y];
  const l1 = linea(`M 380 ${Y} L ${J1} ${Y}`);
  const lr = PY.map((y) => linea(`M ${J1} ${Y} C ${J1 + 90} ${Y}, ${J1 + 60} ${y}, ${PX - 10} ${y}`));
  const lc = PY.map((y) => linea(`M ${PX + 470} ${y} C ${J2 - 40} ${y}, ${J2 - 90} ${Y}, ${J2} ${Y}`));
  const l2 = linea(`M ${J2} ${Y} L ${PR[0] - 10} ${Y}`);
  const punto = $(`<div class="abs" style="width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 24px 6px rgba(var(--halo),.9)"></div>`); M.appendChild(punto);
  // la cámara recorre el flujo (en tramos suaves) mientras el zoom lineal no se detiene nunca
  const CX = (t) => lerp(lerp(190, PX + 230, reboteSuave(k(t, 3.1, 4.5))), PR[0] + 520, reboteSuave(k(t, 4.75, 6.2)));
  pinta = (t) => {
    let e = entra(n1, t, .75, .7, -260, 0); pon(n1, e.x, Y - 45 + e.y, e.s);
    n1.style.borderColor = t > 2.1 ? `rgba(var(--halo),${.35 + .45 * (1 - k(t, 2.1, 3.0))})` : '';
    l1.dibuja(inOut(k(t, 2.3, 2.9)));
    herr.forEach((n, i) => {
      lr[i].dibuja(inOut(k(t, 2.8 + i * .15, 3.4 + i * .15)));
      const e2 = entra(n, t, 3.2 + i * .22, .6, -220, 0); pon(n, PX + e2.x, PY[i] - 45 + e2.y, e2.s);
      const c = n.querySelector('.ck'), tc = 4.0 + i * .3, h = back(k(t, tc, tc + .35));
      c.textContent = t >= tc ? '✓' : ''; c.style.background = t >= tc ? 'var(--acento)' : 'transparent';
      c.style.border = t >= tc ? '0' : '2.5px solid rgba(var(--claro),.35)'; c.style.transform = `scale(${t >= tc ? h : 1}) rotate(${t < tc ? t * 400 : 0}deg)`;
      c.style.borderRightColor = t < tc ? 'transparent' : '';
      lc[i].dibuja(inOut(k(t, 4.75 + i * .08, 5.25 + i * .08)));
    });
    l2.dibuja(inOut(k(t, 5.2, 5.55)));
    const pp = inOut(k(t, 4.75, 5.6)), pq = inOut(k(t - DT, 4.75, 5.6));
    punto.style.opacity = pp > 0 && pp < 1 ? 1 : 0; pon(punto, lerp(J1 + 300, PR[0], pp) - 11, Y - 11);
    desenfoca(punto, Math.abs(pp - pq) * (PR[0] - J1 - 300) / DT * MB, 0);
    e = entra(res, t, 5.45, .6, -220, 0); pon(res, PR[0] + e.x, Y - 300 + e.y, e.s);
    sl.forEach((c, i) => {
      const e3 = entra(c, t, 5.7 + i * .1, .7, 0, 240, .85), ab = rebote(k(t, 6.3, 7.5));
      const x = PR[0] + lerp(i * 22, i * 215, ab), rot = lerp((i - 2) * 6, 0, ab);
      pon(c, x + e3.x, Y - 140 + e3.y + Math.abs(i - 2) * lerp(14, 0, ab), e3.s, `rotate(${rot}deg)`); c.style.zIndex = 10 + i;
    });
    const cx = CX(t), vcx = (cx - CX(t - DT)) / DT;
    M.style.transformOrigin = `${cx}px ${Y}px`;
    M.style.transform = `translate(${960 - cx}px, -40px) scale(1.3)`;
    desenfoca(M, Math.abs(vcx) * 1.3 * MB * .45, 0);   // la cámara, con menos desenfoque que lo que entra (que se lea)
    camara(t, 1.0, 1.18);
  };
  return pinta;
});
</script>
</body></html>
