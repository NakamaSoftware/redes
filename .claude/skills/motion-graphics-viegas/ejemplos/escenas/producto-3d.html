<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Ejemplo «producto-3d» · 3D real (three.js): presentación de producto. Un «dispositivo» (caja redondeada con pantalla de vídeo)
     aparece con rebote, gira, y tres objetos de cristal y metal orbitan a su alrededor; cámara en grúa (de arriba hacia el frente). -->
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<script type="importmap">{ "imports": { "three": "../motor/vendor/three.module.min.js", "three/addons/": "../motor/vendor/addons/" } }</script>
</head><body>
<script type="module">
import { escena3d } from '../motor/motor3d.js';
escena3d({ duracion: 6, ancho: 1920, alto: 1080, fondo: 'marca' }, ({ THREE, MG, scene, obj, mat, rig, entra3d }) => {
  const suelo = obj.suelo(); suelo.position.y = -1.6; scene.add(suelo);
  const disp = new THREE.Group(); scene.add(disp);
  const cuerpo = obj.cajaRedonda(2.3, 3.0, 0.22, mat.oscuro({ roughness: 0.25, metalness: 0.4 }), 0.1); disp.add(cuerpo);
  const pantalla = obj.tarjeta('vid/mc-3.mp4', 2.05, 2.7, 0, { desde: 1 }); pantalla.position.z = 0.12; disp.add(pantalla);
  const orb = [obj.esfera(0.38, mat.vidrio()), obj.toro(0.32, 0.12, mat.coral()), obj.cajaRedonda(0.5, 0.5, 0.5, mat.metal())];
  orb.forEach((o) => scene.add(o));
  const tit = MG.el(`<div class="mg-abs" style="left:150px"><span class="mg-chip" style="font-size:20px">NUEVO</span><div class="mg-titulo" style="font-size:76px;margin-top:22px">Presenta tu <em>producto</em></div><div class="mg-sub" style="font-size:32px;margin-top:14px">objetos, cristal, metal y cámara en grúa</div></div>`);
  return (t) => {
    rig.grua(t, { desde: 7, hasta: 0.6, z: 8.5, centro: [1.0, 0, 0], curva: 'salidaQuint' });
    disp.position.x = 3.1; entra3d(disp, t, 0.2, { y: 0, subida: -2.5, d: 1.3 }); disp.rotation.y = MG.lerp(-0.9, -0.25, MG.curvas.salidaQuint(MG.k(t, 0.2, 2.5))) + Math.sin(t * 0.7) * 0.06;
    orb.forEach((o, i) => { const a = t * 0.9 + i * 2.1, p = MG.curvas.rebote(MG.k(t, 0.9 + i * 0.2, 2.1 + i * 0.2));
      o.position.set(3.1 + Math.cos(a) * 1.75, Math.sin(a * 1.3) * 0.6 + 0.2, Math.sin(a) * 1.3 - 0.2); o.scale.setScalar(Math.max(0.001, p)); o.rotation.set(t, t * 1.3, 0); });
    const e = MG.entra(tit, t, 1.4, { dx: -200, dy: 0 }); MG.pon(tit, e.x, 340 + e.y, e.s);
  };
});
</script>
</body></html>
