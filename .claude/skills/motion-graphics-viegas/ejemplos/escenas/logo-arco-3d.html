<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Ejemplo «logo-arco-3d» · Motion Graphics Viegas. Logo de Claude con barrido de luz (CC Light Sweep) y arco 3D de tarjetas en vídeo que entran escalonadas.
     Sacado del vídeo de YouTube «Carruseles animados con Claude Code» (Viegas Estudio, 22-10-2026).
     Cambia textos, tarjetas (vid/…) y tiempos; la curva, el desenfoque y la cámara ya siguen la guía de estilo. -->
<link rel="stylesheet" href="../motor/estilo.css">
<link rel="stylesheet" href="ejemplos.css">
<script src="../motor/motor.js"></script>
</head><body>
<script>
escena({ duracion: 4.2, ancho: 1920, alto: 1080, fondo: 'marca' }, (MG) => {
  // --- compatibilidad con las funciones del vídeo original (mismos nombres, sobre el motor) ---
  const M = MG.mundo, V = MG.vista, DT = MG.DT, MB = MG.MB, SVGNS = 'http://www.w3.org/2000/svg';
  const { k, lerp, cl, desenfoca, pon, camara: camara0 } = MG;
  const C = MG.curvas, quint = C.salidaQuint, inOut = C.entradaSalidaQuint, suave = C.suave, back = (x) => C.atras(x), rebote = C.rebote, reboteSuave = C.reboteSuave;
  const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
  const entra = (el, t, t0, d = .7, dx = 0, dy = 220, s0 = .94, base = 3, extra = 0) => MG.entra(el, t, t0, { d, dx, dy, escala0: s0, base, extra });
  const camara = (t, z0, z1, ox = 960, oy = 540) => camara0(t, z0, z1, ox, oy);
  const VID = (e, n) => `vid/${String(e).padStart(2, '0')}-${n}.mp4`;
  const VIDS = { push: (o) => MG.registrar(o.v, o) };
  function tarjeta(src, w, h, t0, off = .8, bucle = false) { return MG.tarjeta(src, w, h, t0, { desde: off, bucle: true }); }
  function logoClaude(tam) {
    const w = $(`<div class="abs" style="width:${tam}px;height:${tam}px"><div class="logo abs" style="width:100%;height:100%;filter:drop-shadow(0 0 40px rgba(var(--halo),.55))"></div><div class="barrido abs" style="width:100%;height:100%"></div></div>`);
    w.barre = (x) => { w.children[1].style.backgroundPosition = `${lerp(110, -10, x)}% 0`; w.children[1].style.opacity = x > 0 && x < 1 ? 1 : 0; };
    return w;
  }
  
  let pinta = () => {}; let DUR = 4.2;
  DUR = 4.2;   // 3,7 s de escena + la cola en la que el logo abre la cámara
  const logo = logoClaude(300); M.appendChild(logo);
  const portadas = [1, 3, 5, 9, 6, 10, 7, 2, 4];
  const n = portadas.length, T0 = (i) => 1.4 + Math.abs(i - (n - 1) / 2) * .07;   // entran cuando el logo ya está arriba: nunca se cruzan
  const cards = portadas.map((e, i) => tarjeta(VID(e, 1), 280, 350, T0(i), 1.4));
  pinta = (t) => {
    camara(t, 1.0, 1.12, 960, 430);
    // logo: aparece suave con el barrido de luz y, al decir «carruseles», sube y se queda justo encima del arco
    const a = quint(k(t, 0, .8)), sube = rebote(k(t, .95, 1.9));
    logo.style.opacity = a; logo.style.filter = `blur(${(1 - a) * 18}px)`;
    logo.style.transformOrigin = '150px 150px';
    pon(logo, 960 - 150, lerp(540 - 150 + 20 * (1 - a), 98, sube), lerp(.88 + .12 * a, .5, sube), 'translateZ(120px)'); logo.style.zIndex = 5000;
    logo.barre(k(t, .25, 1.25));
    // arco 3D: las tarjetas suben escalonadas con desenfoque de movimiento y el arco gira sin pararse
    cards.forEach((c, i) => {
      const ang = (i - (n - 1) / 2) * 17 + 6 - t * 4;
      const lejos = Math.max(0, Math.abs(ang) - 28) / 30 * 2.5;   // las del fondo, algo desenfocadas
      const e = entra(c, t, T0(i), .75, 0, 260, .8, 4, lejos);
      const r = 1250, x = 960 + Math.sin(ang * Math.PI / 180) * r, z = (Math.cos(ang * Math.PI / 180) - 1) * r;
      c.style.transform = `translate(${x - 140}px, ${530 - 175 + e.y}px) translateZ(${z}px) rotateY(${ang * .9}deg) scale(${e.s})`;
      c.style.zIndex = Math.round(1000 + z);
    });
  };
  return pinta;
});
</script>
</body></html>
