<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Ejemplo «logo-3d» · 3D real (three.js): el isotipo de Claude construido con rayos 3D de material coral que nacen con rebote
     escalonado, la cámara hace un dolly lento con órbita y un barrido de luz recorre el logo; el título entra debajo. -->
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<script type="importmap">{ "imports": { "three": "../motor/vendor/three.module.min.js", "three/addons/": "../motor/vendor/addons/" } }</script>
</head><body>
<script type="module">
import { escena3d } from '../motor/motor3d.js';
escena3d({ duracion: 5, ancho: 1920, alto: 1080, fondo: 'marca', nieblaCerca: 18, nieblaLejos: 50 }, ({ THREE, MG, scene, obj, mat, rig, luces }) => {
  const logo = new THREE.Group(); scene.add(logo);
  const N = 12, rayos = [];
  for (let i = 0; i < N; i++) {                       // rayos de distinto largo, como el isotipo de Claude
    const largo = i % 2 ? 1.25 : 1.6, r = obj.cajaRedonda(0.34, largo, 0.34, mat.coral(), 0.16);
    const piv = new THREE.Group(); piv.rotation.z = (i / N) * Math.PI * 2 + (i % 3) * 0.05; r.position.y = largo / 2 + 0.18;
    piv.add(r); logo.add(piv); rayos.push({ r, piv, largo });
  }
  const sombra = obj.suelo(); sombra.position.y = -1.6; scene.add(sombra);
  const barrido = new THREE.PointLight(0xffffff, 0, 6); scene.add(barrido);
  const tit = MG.el(`<div class="mg-abs mg-titulo" style="font-size:88px;width:1920px;text-align:center">Claude <em>Code</em></div>`);
  const sub = MG.el(`<div class="mg-abs mg-sub" style="font-size:34px;width:1920px;text-align:center">isotipo en 3D · luces y cámara reales</div>`);
  return (t) => {
    rig.orbita(t, { radio: MG.lerp(11, 9.2, t / 5), desde: -18, hasta: 14, altura: 0.9, centro: [0, 0.15, 0] });   // dolly + órbita, nunca se para
    rayos.forEach((o, i) => { const p = MG.curvas.rebote(MG.k(t, 0.15 + i * 0.05, 0.15 + i * 0.05 + 1.2)); o.r.scale.set(1, Math.max(0.001, p), 1); o.r.position.y = (o.largo * p) / 2 + 0.18; });
    logo.rotation.y = MG.lerp(-0.5, 0.35, MG.curvas.salidaQuint(MG.k(t, 0, 3))) + t * 0.05; logo.position.y = 0.95; logo.scale.setScalar(0.82);
    const b = MG.k(t, 1.6, 2.8); barrido.intensity = b > 0 && b < 1 ? 60 : 0; barrido.position.set(MG.lerp(-3, 3, b), 1.5, 2);   // «light sweep»
    let e = MG.entra(tit, t, 2.0, { dy: 70 }); MG.pon(tit, e.x, 830 + e.y, e.s);
    e = MG.entra(sub, t, 2.25, { dy: 50 }); MG.pon(sub, e.x, 935 + e.y, e.s);
  };
});
</script>
</body></html>
