<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla de lanzamiento «lanz-cita-testimonio» · Viegas IA · Motion Lab
     Comillas gigantes en serif que caen girando con rebote y se quedan respirando; la cita entra palabra a palabra (las
     palabras clave en el acento), una línea se traza, las estrellas se encienden una a una y el autor llega con su avatar.
     «Zoom a través» de las comillas y cierre con logo, marca y lema.
     Cambia "cita" (*palabra* = acento), "autor", "cargo", "avatar" (ruta o "" = iniciales), "estrellas" (0–5), "fondo", "tinta",
     "acento", "marca", "lema", "logo" (ruta o "" = inicial).
     Formato por hash: #9x16 (Reels, por defecto) · #16x9 (YouTube). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=block">
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<style>
:root{ --fuente:'Inter Tight','Inter','Segoe UI',system-ui,sans-serif; --serif:'Instrument Serif',serif;
  --fondo:#141210; --tinta:#F3EBE2; --acento:#D97757; --halo:217,119,87; }
html,body{ background:var(--fondo); }
.mg-fondo{ background:radial-gradient(90% 60% at 20% 0%, rgba(var(--halo),.16), transparent 60%), radial-gradient(80% 60% at 100% 100%, rgba(var(--halo),.10), transparent 60%), var(--fondo); }
.mg-mundo > *{ position:absolute; left:0; top:0; }
.comillas{ font:400 620px/1 var(--serif); color:var(--acento); text-shadow:0 30px 120px rgba(var(--halo),.45); transform-origin:50% 60%; }
.cita{ font:400 92px/1.12 var(--serif); color:var(--tinta); letter-spacing:-.01em; }
.cita em{ font-style:italic; color:var(--acento); }
.cita .mg-trozo{ display:inline-block; }
.linea{ height:3px; border-radius:2px; background:linear-gradient(90deg, var(--acento), rgba(var(--halo),0)); transform-origin:0 50%; }
.estrellas{ display:flex; gap:12px; }
.estrellas svg{ width:52px; height:52px; }
.autor{ display:flex; align-items:center; gap:26px; white-space:nowrap; }
.av{ width:110px; height:110px; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:linear-gradient(150deg, color-mix(in srgb, var(--acento) 60%, #fff), var(--acento));
  color:var(--fondo); font:700 44px var(--fuente); box-shadow:0 0 0 5px var(--fondo), 0 0 0 8px rgba(var(--halo),.6); }
.av img{ width:100%; height:100%; object-fit:cover; }
.autor b{ display:block; font:700 46px var(--fuente); color:var(--tinta); letter-spacing:-.02em; }
.autor span{ display:block; font:500 34px var(--fuente); color:rgba(243,235,226,.6); margin-top:4px; }
.cierre{ position:absolute; inset:0; pointer-events:none; }
.cierre > *{ position:absolute; left:0; top:0; }
.logo{ width:200px; height:200px; border-radius:54px; display:grid; place-items:center; background:var(--acento); color:var(--fondo); font:800 110px var(--fuente); overflow:hidden; box-shadow:0 40px 100px rgba(var(--halo),.4); }
.logo img{ width:100%; height:100%; object-fit:cover; }
.marca{ font:700 96px var(--fuente); letter-spacing:-.04em; color:var(--tinta); white-space:nowrap; }
.lema{ font:400 54px var(--serif); font-style:italic; color:var(--acento); white-space:nowrap; }
</style>
</head><body>
<script id="params" type="application/json">
{
  "formato": "9x16",
  "duracion": 9,
  "fondo": "#141210",
  "tinta": "#F3EBE2",
  "acento": "#D97757",
  "cita": "En una tarde editamos lo que antes nos llevaba *una semana entera.*",
  "autor": "Laura Martín",
  "cargo": "Creadora · 120K seguidores",
  "avatar": "",
  "estrellas": 5,
  "marca": "Viegas Estudio",
  "lema": "Edita con Claude",
  "logo": ""
}
</script>
<script>
const P = JSON.parse(document.getElementById('params').textContent);
for (const [c, v] of new URLSearchParams(location.search)) {
  if (c === 'ver') continue; const d = P[c];
  P[c] = typeof d === 'number' ? parseFloat(v) : (d && typeof d === 'object') ? (() => { try { return JSON.parse(v); } catch { return v.split(','); } })() : v;
}
const FMT = (location.hash.match(/(16x9|9x16)/) || [0, P.formato || '9x16'])[1];
const [W, H] = FMT === '16x9' ? [1920, 1080] : [1080, 1920], VERT = H > W;
const raiz = document.documentElement.style;
const hexRgb = (h) => { const n = parseInt(h.replace('#', '').replace(/^(.)(.)(.)$/, '$1$1$2$2$3$3'), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
if (P.acento) { raiz.setProperty('--acento', P.acento); raiz.setProperty('--halo', hexRgb(P.acento)); }
if (P.fondo) raiz.setProperty('--fondo', P.fondo);
if (P.tinta) raiz.setProperty('--tinta', P.tinta);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const md = (s) => esc(s).replace(/\*([^*]+)\*/g, (_, g) => g.split(' ').map((w) => `<em>${w}</em>`).join(' '));

escena({ duracion: P.duracion, ancho: W, alto: H }, (MG) => {
  const { k, lerp, curvas: C, DT, MB } = MG, D = P.duracion;
  const com = MG.el(`<div class="comillas">“</div>`);
  const anchoC = VERT ? W - 160 : 1300;
  const cita = MG.texto(md(P.cita), 'cita'); cita.style.width = anchoC + 'px'; if (VERT) cita.style.fontSize = '104px';
  const lin = MG.el(`<div class="linea" style="width:${VERT ? 420 : 520}px"></div>`);
  const nE = Math.max(0, Math.min(5, P.estrellas | 0));
  const est = MG.el(`<div class="estrellas">${Array.from({ length: nE }, () => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z" fill="var(--acento)"/></svg>`).join('')}</div>`);
  const ini = String(P.autor || '·').split(' ').map((w) => w[0]).slice(0, 2).join('').toUpperCase();
  const autor = MG.el(`<div class="autor"><div class="av">${P.avatar ? `<img src="${P.avatar}">` : esc(ini)}</div><div><b>${esc(P.autor)}</b><span>${esc(P.cargo)}</span></div></div>`);

  const capa = document.createElement('div'); capa.className = 'cierre'; document.body.appendChild(capa);
  const li = (P.marca || '·').trim()[0].toUpperCase();
  const logo = MG.el(`<div class="logo">${P.logo ? `<img src="${P.logo}">` : li}</div>`, capa);
  const marca = MG.el(`<div class="marca">${esc(P.marca)}</div>`, capa);
  const lema = MG.el(`<div class="lema">${esc(P.lema)}</div>`, capa);

  const nT = cita.trozos.length, tFin = .9 + nT * .11, tZ = D - 2.6, tC = tZ + .55;
  let L = null;
  return (t) => {
    if (!L) {
      const hc = cita.offsetHeight;
      if (VERT) { const y0 = 470; L = { cx: 80, cy: y0 + 330, comX: 40, comY: y0 - 160, ly: y0 + 330 + hc + 50, ey: y0 + 330 + hc + 90, ay: y0 + 330 + hc + 180 }; }
      else { const y0 = (H - (hc + 330)) / 2; L = { cx: 440, cy: y0, comX: 250, comY: y0 - 200, ly: y0 + hc + 40, ey: y0 + hc + 80, ay: y0 + hc + 170 }; }
      L.zx = L.comX + com.offsetWidth / 2; L.zy = L.comY + com.offsetHeight * .45;
    }
    // ---- cámara: deriva lenta continua y «zoom a través» de las comillas
    const pz = C.entradaCubica(k(t, tZ, tC + .1));
    const z = lerp(1, 1.08, C.suave(t / D)) * (1 + 9 * pz);
    MG.vista.style.transformOrigin = `${L.zx}px ${L.zy}px`;
    MG.vista.style.transform = `scale(${z}) translate(${Math.sin(t * .45) * 10}px, ${Math.cos(t * .35) * 12}px)`;
    MG.vista.style.filter = pz > 0 ? `blur(${pz * 16}px)` : '';
    MG.vista.style.opacity = 1 - C.entradaCubica(k(t, tC - .15, tC + .1));

    // comillas: caen girando con rebote fuerte y luego respiran
    const ec = MG.entra(com, t, .1, { d: .75, dy: -380, escala0: .4, curva: 'reboteFuerte', base: 10 });
    MG.pon(com, L.comX, L.comY + ec.y, ec.s * (1 + .02 * Math.sin(t * 2)), `rotate(${-35 * (1 - C.salidaQuint(k(t, .1, 1.1)))}deg)`);
    // cita palabra a palabra (salidaExpo: rápida y frena), las palabras clave con rebote
    MG.pon(cita, L.cx, L.cy);
    cita.trozos.forEach((s, i) => { const kw = !!s.querySelector('em');
      const e = MG.entra(s, t, .9 + i * .11, { d: kw ? .6 : .5, dy: kw ? 90 : 50, escala0: kw ? .7 : 1, curva: kw ? 'rebote' : 'salidaExpo', base: 6 });
      s.style.transform = `translateY(${e.y}px) scale(${e.s})`; });
    // línea que se traza
    const pl = C.salidaQuint(k(t, tFin, tFin + .7)); lin.style.transform = `scaleX(${pl})`; MG.pon(lin, L.cx, L.ly); lin.style.transform += ` scaleX(${pl})`;
    // estrellas una a una con rebote y giro
    [...est.children].forEach((s, i) => { const a = tFin + .2 + i * .1, p = C.reboteFuerte(k(t, a, a + .7));
      s.style.transform = `scale(${Math.max(0, p)}) rotate(${(1 - Math.min(1, p)) * -90}deg)`; s.style.opacity = Math.min(1, Math.max(0, p) * 2); });
    MG.pon(est, L.cx, L.ey);
    // autor: entra lateral con frenada suave
    const ea = MG.entra(autor, t, tFin + .55, { d: .7, dx: -140, dy: 0, curva: 'salidaQuint', base: 6 });
    MG.pon(autor, L.cx + ea.x, L.ay);

    // ---- cierre
    const yb = (H - 440) / 2;
    const el1 = MG.entra(logo, t, tC, { d: .7, dy: 0, escala0: 2.4, curva: 'salidaExpo', base: 20 });
    MG.pon(logo, (W - 200) / 2, yb, el1.s, `rotate(${-12 * (1 - C.salidaQuint(k(t, tC, tC + .9)))}deg)`);
    const e2 = MG.entra(marca, t, tC + .2, { d: .6, dy: 70, curva: 'salidaQuint', base: 8 });
    MG.pon(marca, (W - marca.offsetWidth) / 2, yb + 250 + e2.y);
    const e3 = MG.entra(lema, t, tC + .4, { d: .7, dy: 50, curva: 'rebote', base: 5 });
    MG.pon(lema, (W - lema.offsetWidth) / 2, yb + 380 + e3.y);
    capa.style.transformOrigin = '50% 50%'; capa.style.transform = `scale(${1 + .04 * k(t, tC, D)})`;
  };
});
</script>
</body></html>
