<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla de lanzamiento «lanz-terminal-claude» · Viegas IA · Motion Lab
     Ventana de terminal estilo Claude Code inclinada en perspectiva suave: cabecera con el asterisco de acento, el prompt
     «>» escribe tu petición, un spinner con verbo gira, aparecen los pasos (✓) con su línea de diff (+/−) y un resumen
     final; la cámara recorre la ventana sin pararse y entra por el asterisco («zoom a través») al cierre con logo.
     Cambia "titulo" (cabecera), "peticion", "pensando" (verbo del spinner), "pasos" ([{texto, mas, menos}]), "resumen",
     colores "fondo", "ventana", "tinta", "acento", "verde", "rojo", y el cierre "titular" (*palabra* = acento), "marca", "logo".
     Formato por hash: #9x16 (Reels, por defecto) · #16x9 (YouTube). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=block">
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<style>
:root{ --fuente:'Inter Tight',system-ui,sans-serif; --mono:'JetBrains Mono',Consolas,monospace; --serif:'Instrument Serif',serif;
  --fondo:#141210; --ventana:#1A1714; --tinta:#F4EDE4; --mute:#8C837B; --acento:#D97757; --halo:217,119,87; --verde:#7FC08A; --rojo:#E07A6E; }
html,body{ background:var(--fondo); }
.mg-fondo{ background:radial-gradient(70% 50% at 50% 50%, rgba(var(--halo),.16), transparent 70%), var(--fondo); }
.mg-vista{ perspective:2400px; }
.mg-mundo > *{ position:absolute; left:0; top:0; }
.mg-mundo em{ font-family:var(--serif); font-style:italic; font-weight:400; color:var(--acento); }
.win{ border-radius:30px; background:var(--ventana); border:1.5px solid rgba(244,237,228,.1); overflow:hidden;
  box-shadow:0 70px 160px rgba(0,0,0,.6), 0 0 120px rgba(var(--halo),.08), inset 0 1px 0 rgba(255,255,255,.05); }
.bar{ height:76px; display:flex; align-items:center; gap:14px; padding:0 30px; border-bottom:1.5px solid rgba(244,237,228,.07); }
.bar i{ width:20px; height:20px; border-radius:50%; background:rgba(244,237,228,.16); }
.bar span{ margin-left:16px; font:500 26px var(--mono); color:var(--mute); }
.cab{ margin:34px 36px 0; border:2px solid var(--acento); border-radius:18px; padding:22px 28px; display:flex; gap:20px; align-items:center; font:500 30px var(--mono); color:var(--tinta); }
.ast{ width:48px; height:48px; flex:none; color:var(--acento); }
.cab small{ display:block; color:var(--mute); font-size:24px; margin-top:4px; }
.ln{ font:400 var(--fs,32px)/1.45 var(--mono); color:var(--tinta); white-space:pre-wrap; }
.pr{ color:var(--acento); font-weight:700; }
.mute{ color:var(--mute); }
.ok{ color:var(--verde); font-weight:700; }
.mas{ color:var(--verde); } .menos{ color:var(--rojo); }
.cur{ display:inline-block; width:.6em; height:1.1em; background:var(--tinta); vertical-align:-.2em; }
.spin{ color:var(--acento); font-weight:700; }
.logo{ width:200px; height:200px; border-radius:56px; display:grid; place-items:center; overflow:hidden; color:#fff; background:var(--acento); box-shadow:0 40px 110px rgba(var(--halo),.5); }
.logo .ast{ width:124px; height:124px; color:#fff; } .logo img{ width:100%; height:100%; object-fit:contain; }
.tit{ font:700 116px/1.02 var(--fuente); letter-spacing:-.05em; color:var(--tinta); text-align:center; }
.marca{ font:500 38px var(--mono); color:var(--mute); white-space:nowrap; }
</style>
</head><body>
<script id="params" type="application/json">
{
  "formato": "9x16",
  "duracion": 10,
  "fondo": "#141210",
  "ventana": "#1A1714",
  "tinta": "#F4EDE4",
  "acento": "#D97757",
  "verde": "#7FC08A",
  "rojo": "#E07A6E",
  "titulo": "Claude Code",
  "peticion": "edita mi reel de hoy y ponle subtítulos",
  "pensando": "Editando",
  "pasos": [
    { "texto": "Cortes de silencios", "mas": 0, "menos": 38 },
    { "texto": "Subtítulos con keywords", "mas": 112, "menos": 0 },
    { "texto": "Motion graphics", "mas": 6, "menos": 0 },
    { "texto": "Exportado a 4K", "mas": 1, "menos": 0 }
  ],
  "resumen": "Listo en 3 min 12 s",
  "titular": "Tu editor *vive en la terminal*",
  "marca": "Viegas IA",
  "logo": ""
}
</script>
<script>
const P = JSON.parse(document.getElementById('params').textContent);
for (const [c, v] of new URLSearchParams(location.search)) {
  if (c === 'ver') continue; const d = P[c];
  P[c] = typeof d === 'number' ? parseFloat(v) : (d && typeof d === 'object') ? (() => { try { return JSON.parse(v); } catch { return v.split(','); } })() : v;
}
const FMT = (location.hash.match(/(16x9|9x16)/) || [0, P.formato || '9x16'])[1];
const [W, H] = FMT === '16x9' ? [1920, 1080] : [1080, 1920], VERT = H > W;
const raiz = document.documentElement.style;
const hexRgb = (h) => { const n = parseInt(h.replace('#', '').replace(/^(.)(.)(.)$/, '$1$1$2$2$3$3'), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
['fondo', 'ventana', 'tinta', 'acento', 'verde', 'rojo'].forEach((c) => P[c] && raiz.setProperty('--' + c, P[c]));
if (P.acento) raiz.setProperty('--halo', hexRgb(P.acento));
const md = (s) => String(s).replace(/\*([^*]+)\*/g, (_, g) => g.split(' ').map((w) => `<em>${w}</em>`).join(' '));
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const AST = '<svg class="ast" viewBox="0 0 24 24" fill="currentColor"><g transform="translate(12 12)">' +
  [0, 30, 60, 90, 120, 150].map((a) => `<rect x="-1.5" y="-11" width="3" height="22" rx="1.5" transform="rotate(${a})"/>`).join('') + '</g></svg>';
const SPIN = ['·', '✢', '✳', '✶', '✻', '✽'];

escena({ duracion: P.duracion, ancho: W, alto: H }, (MG) => {
  const { k, lerp, curvas: C } = MG, D = P.duracion;
  const WW = VERT ? 980 : 1340, WH = VERT ? 1040 : 860;
  const win = MG.el(`<div class="win" style="width:${WW}px;height:${WH}px"><div class="bar"><i></i><i></i><i></i><span>~/reels — claude</span></div>
    <div class="cab">${AST}<div>${esc(P.titulo)}<small>/ayuda · listo para trabajar</small></div></div><div class="cuerpo" style="padding:30px 40px"></div></div>`);
  if (VERT) win.style.setProperty('--fs', '37px');
  const cuerpo = win.querySelector('.cuerpo'), astCab = win.querySelector('.cab .ast');
  const pasos = (P.pasos || []).slice(0, 5), pet = String(P.peticion);
  const logo = MG.el(`<div class="logo">${P.logo ? `<img src="${P.logo}">` : AST}</div>`);
  const anchoT = VERT ? W - 140 : 1500;
  const tit = MG.texto(md(P.titular), 'tit'); tit.style.width = anchoT + 'px';
  const marca = MG.el(`<div class="marca">${esc(P.marca)}</div>`);

  const tW = .1, tP = 1.0, vel = 26, tPF = tP + pet.length / vel, tEnt = tPF + .25, tSpin = tEnt + .15;
  const pasoD = .45, tPasos = tSpin + .9, tRes = tPasos + pasos.length * pasoD + .2, tZoom = tRes + .9, tCie = tZoom + .6;
  const lineas = pasos.map((p, i) => ({ p, a: tPasos + i * pasoD }));
  let L = null;
  return (t) => {
    if (!L) L = { x: (W - WW) / 2, y: VERT ? (H - WH) / 2 - 40 : (H - WH) / 2 };
    const vivo = t < tCie;
    win.style.visibility = vivo ? 'visible' : 'hidden';
    [logo, tit, marca].forEach((e) => { e.style.visibility = vivo ? 'hidden' : 'visible'; });
    const zi = C.entradaCubica(k(t, tZoom, tCie)), zo = C.salidaQuint(k(t, tCie - .05, tCie + 1.1));
    if (vivo) {
      // cámara: deriva y paneo vertical siguiendo la escritura; al final entra por el asterisco de la cabecera
      const ar = astCab.getBoundingClientRect ? null : null;
      const axW = L.x + 36 + 28 + 24, ayW = L.y + 76 + 34 + 22 + 24;
      const pan = C.afterEffects(k(t, tEnt, tRes + .4));
      const oy = lerp(L.y + 300, L.y + WH * .6, pan);
      const ox = lerp(W / 2, axW, zi), oyy = lerp(oy, ayW, zi);
      const z = lerp(1.0, 1.08, C.suave(t / D)) * (1 + 12 * zi);
      MG.vista.style.transformOrigin = `${ox}px ${oyy}px`;
      MG.vista.style.transform = `scale(${z}) translate(${Math.sin(t * .4) * 10}px, ${Math.cos(t * .31) * 10}px)`;
      MG.mundo.style.filter = zi > .03 ? `blur(${zi * 9}px)` : 'none';
      // ventana: entra desde abajo girada en 3D (salidaExpo) y se endereza; vaivén suave continuo
      const e = MG.entra(win, t, tW, { d: .9, dy: 300, escala0: .9, curva: 'salidaExpo', base: 10 });
      const rx = lerp(24, 6, C.salidaQuint(k(t, tW, tW + 1.3))) + Math.sin(t * .5) * 1.5, ry = Math.sin(t * .35) * 4 - 3;
      MG.pon(win, L.x, L.y + e.y, e.s, `rotateX(${rx}deg) rotateY(${ry}deg)`);
      astCab.style.transform = `rotate(${t * 40}deg)`;
      // cuerpo
      let h = '';
      const n = Math.max(0, Math.min(pet.length, Math.floor((t - tP) * vel)));
      const curOn = t < tEnt && Math.floor(t * 2.6) % 2 === 0 || (t > tP - .2 && t < tPF);
      if (t > tP - .3) h += `<div class="ln"><span class="pr">&gt;</span> ${esc(pet.slice(0, n))}${t < tEnt + .1 && curOn ? '<span class="cur"></span>' : ''}</div>`;
      if (t > tSpin) {
        const hecho = t > tRes;
        const sp = hecho ? '<span class="ok">✻</span>' : `<span class="spin">${SPIN[Math.floor(t * 10) % SPIN.length]}</span>`;
        const seg = Math.floor(Math.max(0, Math.min(t, tRes) - tSpin) * 14);
        h += `<div class="ln" style="margin-top:22px">${sp} ${hecho ? esc(P.resumen) : esc(P.pensando) + '…'}${hecho ? "" : ` <span class="mute">(${seg}s · esc para parar)</span>`}</div>`;
      }
      lineas.forEach(({ p, a }, i) => {
        if (t < a) return;
        const pp = C.salidaQuint(k(t, a, a + .35)), ch = C.salidaCubica(k(t, a + .15, a + .4));
        const dif = [p.mas ? `<span class="mas">+${p.mas}</span>` : '', p.menos ? `<span class="menos">−${p.menos}</span>` : ''].filter(Boolean).join(' ');
        h += `<div class="ln" style="margin-top:${i ? 6 : 20}px;opacity:${pp};transform:translateX(${(1 - pp) * -40}px);filter:blur(${(1 - pp) * 6}px)">  <span class="ok" style="display:inline-block;transform:scale(${.4 + .6 * C.reboteFuerte(k(t, a + .1, a + .6))})">✓</span> ${esc(p.texto)}${VERT ? '\n    ' : '  '}<span class="mute">${dif}</span></div>`;
      });
      if (t > tRes) {
        const pr = C.salidaQuint(k(t, tRes, tRes + .4));
        h += `<div class="ln" style="margin-top:22px;opacity:${pr}"><span class="pr">&gt;</span> ${Math.floor(t * 2.6) % 2 === 0 ? '<span class="cur"></span>' : ''}</div>`;
      }
      cuerpo.innerHTML = h;
    } else {
      MG.mundo.style.filter = (1 - zo) * 12 > .3 ? `blur(${(1 - zo) * 12}px)` : 'none';
      MG.vista.style.transformOrigin = `${W / 2}px ${H / 2}px`;
      MG.vista.style.transform = `scale(${lerp(1.7, 1, zo) * (1 + .04 * k(t, tCie, D))}) rotate(${(1 - zo) * -4}deg)`;
      const blk = 200 + 60 + tit.offsetHeight + 40 + 50, y0 = (H - blk) / 2;
      const e1 = MG.entra(logo, t, tCie, { d: .8, escala0: .3, curva: 'reboteFuerte', base: 6 });
      MG.pon(logo, (W - 200) / 2, y0, e1.s, `rotate(${(1 - C.salidaQuint(k(t, tCie, tCie + 1.2))) * -120 + (t - tCie) * 10}deg)`);
      MG.pon(tit, (W - anchoT) / 2, y0 + 260);
      tit.trozos.forEach((sp, i) => { const e = MG.entra(sp, t, tCie + .3 + i * .07, { d: .6, dy: 70, curva: 'salidaExpo', base: 7 });
        sp.style.display = 'inline-block'; sp.style.transform = `translateY(${e.y}px)`; });
      const e3 = MG.entra(marca, t, tCie + .55 + tit.trozos.length * .07, { d: .6, dy: 40, curva: 'salidaCubica', base: 5 });
      MG.pon(marca, (W - marca.offsetWidth) / 2, y0 + 260 + tit.offsetHeight + 40 + e3.y);
    }
  };
});
</script>
</body></html>
