<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla de lanzamiento «lanz-post-social» · Viegas IA · Motion Lab
     Un post (estilo X/Threads) que se arma pieza a pieza sobre fondo oscuro: tarjeta que entra con muelle, avatar que cae,
     nombre + verificado que se dibuja, texto que se escribe con cursor, imagen que se despliega, contadores que suben y un
     corazón que late; la cámara se acerca a la imagen y hace «zoom a través» hasta el cierre con logo.
     Cambia "autor" {nombre, usuario, avatar: ruta o "" = inicial}, "texto" (*palabra* = acento), "imagen" (ruta o "" = degradado),
     "contadores" ([{icono: respuesta|repost|corazon, desde, hasta}]), colores "fondo", "tarjeta", "tinta", "acento", y el cierre "marca", "lema", "logo".
     Formato por hash: #9x16 (Reels, por defecto) · #16x9 (YouTube). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=block">
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<style>
:root{ --fuente:'Inter Tight','Inter','Segoe UI',system-ui,sans-serif; --serif:'Instrument Serif',serif;
  --fondo:#141210; --tarjeta:#1E1B18; --tinta:#F4EDE4; --mute:#9A9088; --acento:#D97757; --halo:217,119,87; }
html,body{ background:var(--fondo); }
.mg-fondo{ background:radial-gradient(120% 80% at 50% 110%, rgba(var(--halo),.28), transparent 60%), var(--fondo); }
.mg-mundo > *{ position:absolute; left:0; top:0; }
.mg-mundo em{ font-family:var(--serif); font-style:italic; font-weight:400; color:var(--acento); }
.rej{ position:absolute; left:-600px; top:-600px; width:3200px; height:3200px; background-image:radial-gradient(rgba(244,237,228,.09) 2px, transparent 2.5px); background-size:46px 46px; }
.post{ border-radius:44px; background:var(--tarjeta); border:1.5px solid rgba(244,237,228,.08);
  box-shadow:0 60px 140px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); }
.av{ width:110px; height:110px; border-radius:50%; overflow:hidden; display:grid; place-items:center; font:700 54px var(--fuente); color:#fff;
  background:linear-gradient(150deg, color-mix(in srgb, var(--acento) 60%, #fff), var(--acento)); box-shadow:0 10px 30px rgba(var(--halo),.35); }
.av img{ width:100%; height:100%; object-fit:cover; }
.nom{ font:700 44px var(--fuente); color:var(--tinta); letter-spacing:-.02em; white-space:nowrap; display:flex; align-items:center; gap:12px; }
.usr{ font:500 34px var(--fuente); color:var(--mute); white-space:nowrap; }
.txt{ font:500 54px/1.22 var(--fuente); color:var(--tinta); letter-spacing:-.02em; }
.cur{ display:inline-block; width:5px; height:1em; background:var(--acento); vertical-align:-.12em; margin-left:4px; }
.img{ border-radius:30px; overflow:hidden; background:radial-gradient(80% 90% at 30% 20%, color-mix(in srgb, var(--acento) 70%, #fff), var(--acento) 45%, #2a1610); }
.img img{ width:100%; height:100%; object-fit:cover; display:block; }
.img .brillo{ position:absolute; inset:0; background:linear-gradient(110deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%); }
.cnt{ display:flex; align-items:center; gap:14px; font:600 38px var(--fuente); color:var(--mute); font-variant-numeric:tabular-nums; white-space:nowrap; }
.cnt svg{ width:46px; height:46px; }
.cnt.on{ color:var(--acento); }
.logo{ width:200px; height:200px; border-radius:56px; display:grid; place-items:center; overflow:hidden; font:700 110px var(--fuente); color:#fff;
  background:linear-gradient(150deg, color-mix(in srgb, var(--acento) 55%, #fff), var(--acento)); box-shadow:0 40px 100px rgba(var(--halo),.45); }
.logo img{ width:100%; height:100%; object-fit:contain; }
.marca{ font:700 130px/1 var(--fuente); letter-spacing:-.05em; color:var(--tinta); white-space:nowrap; }
.lema{ font:400 70px/1.1 var(--serif); font-style:italic; color:var(--acento); white-space:nowrap; }
</style>
</head><body>
<script id="params" type="application/json">
{
  "formato": "9x16",
  "duracion": 9,
  "fondo": "#141210",
  "tarjeta": "#1E1B18",
  "tinta": "#F4EDE4",
  "acento": "#D97757",
  "autor": { "nombre": "Viegas Estudio", "usuario": "@viegasestudio", "avatar": "" },
  "texto": "He editado este reel entero *con Claude Code*. Sin abrir Premiere.",
  "imagen": "",
  "contadores": [
    { "icono": "respuesta", "desde": 12, "hasta": 248 },
    { "icono": "repost", "desde": 40, "hasta": 1260 },
    { "icono": "corazon", "desde": 300, "hasta": 18400 }
  ],
  "marca": "Viegas IA",
  "lema": "edita con Claude",
  "logo": ""
}
</script>
<script>
const P = JSON.parse(document.getElementById('params').textContent);
for (const [c, v] of new URLSearchParams(location.search)) {
  if (c === 'ver') continue; const d = P[c];
  P[c] = typeof d === 'number' ? parseFloat(v) : (d && typeof d === 'object') ? (() => { try { return JSON.parse(v); } catch { return v.split(','); } })() : v;
}
const FMT = (location.hash.match(/(16x9|9x16)/) || [0, P.formato || '9x16'])[1];
const [W, H] = FMT === '16x9' ? [1920, 1080] : [1080, 1920], VERT = H > W;
const raiz = document.documentElement.style;
const hexRgb = (h) => { const n = parseInt(h.replace('#', '').replace(/^(.)(.)(.)$/, '$1$1$2$2$3$3'), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
['fondo', 'tarjeta', 'tinta', 'acento'].forEach((c) => P[c] && raiz.setProperty('--' + c, P[c]));
if (P.acento) raiz.setProperty('--halo', hexRgb(P.acento));
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const ICON = {
  respuesta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  repost: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>',
  corazon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3.2 4.5 6.9 4.5c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.7 0 6 3.7 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>',
};
const num = (n) => n >= 10000 ? (n / 1000).toFixed(1).replace('.', ',') + ' mil' : Math.round(n).toLocaleString('es-ES');

escena({ duracion: P.duracion, ancho: W, alto: H }, (MG) => {
  const { k, lerp, curvas: C } = MG, D = P.duracion;
  MG.mundo.prepend(MG.el('<div class="rej"></div>'));
  const A = P.autor || {}, ini = (A.nombre || '·').trim()[0].toUpperCase();
  const PW = VERT ? 940 : 1000, pad = 56;
  const IW = PW - pad * 2, IH = VERT ? 500 : 0;
  const post = MG.el(`<div class="post"></div>`);
  const av = MG.el(`<div class="av">${A.avatar ? `<img src="${A.avatar}">` : ini}</div>`);
  const nom = MG.el(`<div class="nom">${esc(A.nombre)}<svg width="44" height="44" viewBox="0 0 24 24"><path d="M12 1.5l2.6 1.9 3.2-.2 1 3 2.7 1.8-1 3 1 3-2.7 1.8-1 3-3.2-.2L12 22.5l-2.6-1.9-3.2.2-1-3L2.5 16l1-3-1-3 2.7-1.8 1-3 3.2.2z" fill="var(--acento)"/><path class="chk" d="M7.5 12.3l3 3 6-6.3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/></svg></div>`);
  const chk = nom.querySelector('.chk');
  const usr = MG.el(`<div class="usr">${esc(A.usuario)} · ahora</div>`);
  const txt = MG.el(`<div class="txt" style="width:${IW}px"></div>`);
  const letras = []; let enAc = false;
  for (const ch of String(P.texto)) { if (ch === '*') { enAc = !enAc; continue; } letras.push([ch, enAc]); }
  const htmlHasta = (n) => { let h = '', ac = false; letras.slice(0, n).forEach(([c, a]) => { if (a !== ac) { h += a ? '<em>' : '</em>'; ac = a; } h += esc(c); }); return h + (ac ? '</em>' : ''); };
  const imgW = VERT ? IW : 600, imgH = VERT ? IH : 600;
  const img = MG.el(`<div class="img" style="width:${imgW}px;height:${imgH}px">${P.imagen ? `<img src="${P.imagen}">` : ''}<div class="brillo"></div></div>`);
  const brillo = img.querySelector('.brillo');
  const cnts = (P.contadores || []).slice(0, 4).map((c) => { const e = MG.el(`<div class="cnt">${ICON[c.icono] || ICON.corazon}<span></span></div>`); e._c = c; e._s = e.querySelector('span'); return e; });
  const logo = MG.el(`<div class="logo">${P.logo ? `<img src="${P.logo}">` : esc((P.marca || '·').trim()[0])}</div>`);
  const marca = MG.el(`<div class="marca">${esc(P.marca)}</div>`), lema = MG.el(`<div class="lema">${esc(P.lema)}</div>`);

  const tPost = .15, tAv = .45, tNom = .7, tTx = 1.1, vel = 30, tTxF = tTx + letras.length / vel;
  const tImg = tTxF + .15, tCnt = tImg + .5, tZoom = D - 2.6, tCie = tZoom + .55;
  let L = null;
  return (t) => {
    if (!L) {
      txt.innerHTML = htmlHasta(letras.length); const th = txt.offsetHeight; txt.innerHTML = '';
      const ph = pad + 110 + 40 + th + 40 + (VERT ? IH + 44 : 0) + 50 + pad;
      const PY = VERT ? Math.max(290, (H - ph) / 2 - 60) : (H - ph) / 2;
      const PX = VERT ? (W - PW) / 2 : (W - PW - 600 + 40) / 2 - 20;
      L = { th, ph, PY, PX };
    }
    const px = L.PX, py = L.PY;
    const zi = C.entradaCubica(k(t, tZoom, tCie)), zo = C.salidaQuint(k(t, tCie - .05, tCie + 1.2));
    const ix = VERT ? px + pad : px + PW - 40, iy = VERT ? py + pad + 150 + L.th + 40 : (H - imgH) / 2;
    const vivo = t < tCie;
    [post, av, nom, usr, txt, img, ...cnts].forEach((e) => { e.style.visibility = vivo ? 'visible' : 'hidden'; });
    [logo, marca, lema].forEach((e) => { e.style.visibility = vivo ? 'hidden' : 'visible'; });
    if (vivo) {
      // cámara: deriva continua + zoom a través de la imagen (acelera: entradaCubica)
      const z = lerp(1, 1.08, C.suave(t / D)) * (1 + 7 * zi);
      MG.vista.style.transformOrigin = `${ix + imgW / 2}px ${iy + imgH / 2}px`;
      MG.vista.style.transform = `scale(${z}) translate(${Math.sin(t * .5) * 10}px, ${Math.cos(t * .37) * 12}px) rotate(${Math.sin(t * .3) * .6}deg)`;
      const bl = zi * 14; MG.mundo.style.filter = bl > .3 ? `blur(${bl}px)` : 'none'; MG.mundo.style.opacity = 1 - C.entradaCubica(k(t, tCie - .25, tCie));
      const e0 = MG.entra(post, t, tPost, { d: .8, dy: 260, escala0: .92, curva: 'salidaQuint', base: 10 });
      post.style.width = PW + 'px'; post.style.height = L.ph + 'px'; MG.pon(post, px, py + e0.y, e0.s);
      const e1 = MG.entra(av, t, tAv, { d: .7, dy: -120, escala0: .3, curva: 'reboteFuerte', base: 8 }); MG.pon(av, px + pad, py + pad + e1.y, e1.s);
      const e2 = MG.entra(nom, t, tNom, { d: .6, dx: -80, curva: 'salidaExpo', base: 8 }); MG.pon(nom, px + pad + 140 + e2.x, py + pad + 6);
      chk.style.strokeDashoffset = 1 - C.salidaCubica(k(t, tNom + .35, tNom + .8));
      const e3 = MG.entra(usr, t, tNom + .12, { d: .6, dx: -60, curva: 'salidaQuint', base: 6 }); MG.pon(usr, px + pad + 140 + e3.x, py + pad + 64);
      const n = Math.max(0, Math.min(letras.length, Math.floor((t - tTx) * vel)));
      const parp = t > tTx - .3 && t < tCnt + .4 && (t < tTxF || Math.floor(t * 2.4) % 2 === 0);
      txt.innerHTML = htmlHasta(n) + (parp ? '<span class="cur"></span>' : '');
      MG.pon(txt, px + pad, py + pad + 150);
      const pi = C.salidaQuint(k(t, tImg, tImg + .8)), pb = k(t, tImg + .4, tImg + 1.6);
      img.style.clipPath = `inset(${(1 - pi) * 50}% ${(1 - pi) * 12}% ${(1 - pi) * 50}% ${(1 - pi) * 12}% round 30px)`;
      MG.pon(img, ix, iy + (1 - pi) * 60, lerp(1.08, 1, pi), VERT ? '' : `rotate(${lerp(7, 3, pi) + Math.sin(t * .6)}deg)`);
      brillo.style.transform = `translateX(${lerp(-120, 120, pb)}%)`;
      const cy = py + L.ph - pad - 50;
      cnts.forEach((c, i) => {
        const a = tCnt + i * .14, e = MG.entra(c, t, a, { d: .55, dy: 50, curva: 'rebote', base: 6 });
        c._s.textContent = num(lerp(c._c.desde, c._c.hasta, C.salidaExpo(k(t, a + .1, a + 2.2))));
        const last = i === cnts.length - 1, on = last && t > a + .9;
        c.classList.toggle('on', on);
        const sx = on && t < a + 1.5 ? 1 + .25 * Math.sin(Math.PI * k(t, a + .9, a + 1.5)) : 1;
        MG.pon(c, px + pad + i * ((PW - pad * 2) / cnts.length), cy + e.y, e.s * sx);
      });
    } else {
      // cierre: llega desde el zoom (escala 1.6 → 1, desenfoque que se aclara) y sigue acercándose despacio
      MG.mundo.style.opacity = 1;
      MG.vista.style.transformOrigin = `${W / 2}px ${H / 2}px`;
      MG.vista.style.transform = `scale(${lerp(1.6, 1, zo) * (1 + .04 * k(t, tCie, D))}) rotate(${(1 - zo) * -3}deg)`;
      const bl = (1 - zo) * 16; MG.mundo.style.filter = bl > .3 ? `blur(${bl}px)` : 'none';
      const y0 = (H - 480) / 2;
      const e1 = MG.entra(logo, t, tCie + .05, { d: .7, dy: 120, escala0: .5, curva: 'reboteFuerte', base: 8 });
      MG.pon(logo, (W - 200) / 2, y0 + e1.y, e1.s);
      const e2 = MG.entra(marca, t, tCie + .25, { d: .6, dy: 60, curva: 'salidaQuint', base: 8 }); MG.pon(marca, (W - marca.offsetWidth) / 2, y0 + 250 + e2.y);
      const e3 = MG.entra(lema, t, tCie + .42, { d: .6, dy: 40, curva: 'salidaCubica', base: 6 }); MG.pon(lema, (W - lema.offsetWidth) / 2, y0 + 400 + e3.y);
    }
  };
});
</script>
</body></html>
