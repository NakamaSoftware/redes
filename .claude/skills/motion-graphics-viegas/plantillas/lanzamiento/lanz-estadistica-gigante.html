<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla de lanzamiento «lanz-estadistica-gigante» · Viegas IA · Motion Lab
     Cifra gigante que cuenta con frenada suave, etiqueta y comparativa; debajo (9:16) o al lado (16:9) un gráfico de barras
     que crecen escalonadas y una línea que se dibuja por encima, la última barra se marca como récord; la cámara se acerca
     sin parar, «zoom a través» de la barra récord y cierre con logo, marca y lema.
     Cambia "valor", "decimales", "prefijo", "sufijo", "etiqueta", "comparativa", "datos" (números), "etiquetasDatos",
     "chip", "grafico" ("barras" | "linea" | "ambos"), colores ("fondo", "tinta", "acento"), "marca", "lema", "logo" (ruta o "" = inicial).
     Formato por hash: #9x16 (Reels, por defecto) · #16x9 (YouTube). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=block">
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<style>
:root{ --fuente:'Inter Tight','Inter','Segoe UI',system-ui,sans-serif; --serif:'Instrument Serif',serif;
  --fondo:#141210; --tinta:#F3EBE2; --acento:#D97757; --halo:217,119,87; }
html,body{ background:var(--fondo); }
.mg-fondo{ background:radial-gradient(120% 80% at 50% 110%, rgba(var(--halo),.22), transparent 60%), var(--fondo); }
.mancha{ position:absolute; border-radius:50%; filter:blur(140px); pointer-events:none; background:var(--acento); }
.mg-mundo > *{ position:absolute; left:0; top:0; }
.eti{ font:600 34px var(--fuente); letter-spacing:.14em; text-transform:uppercase; color:rgba(243,235,226,.6); white-space:nowrap; }
.eti b{ color:var(--acento); }
.num{ font:800 330px/0.9 var(--fuente); letter-spacing:-.06em; color:var(--tinta); font-variant-numeric:tabular-nums; white-space:nowrap; }
.num span{ color:var(--acento); }
.comp{ display:flex; align-items:center; gap:16px; font:500 40px var(--fuente); color:var(--tinta); white-space:nowrap; }
.comp i{ font-style:normal; display:inline-grid; place-items:center; width:58px; height:58px; border-radius:50%; background:rgba(var(--halo),.18); color:var(--acento); font-weight:700; }
.panel{ border-radius:44px; background:rgba(255,255,255,.035); border:1.5px solid rgba(255,255,255,.08); }
.barra{ position:absolute; bottom:0; border-radius:16px 16px 6px 6px; transform-origin:50% 100%;
  background:linear-gradient(180deg, rgba(243,235,226,.28), rgba(243,235,226,.08)); }
.barra.top{ background:linear-gradient(180deg, var(--acento), color-mix(in srgb, var(--acento) 40%, var(--fondo))); box-shadow:0 0 60px rgba(var(--halo),.45); }
.ejeT{ position:absolute; font:500 24px var(--fuente); color:rgba(243,235,226,.45); text-align:center; }
.chip{ padding:14px 26px; border-radius:99px; background:var(--acento); color:var(--fondo); font:700 30px var(--fuente); white-space:nowrap; box-shadow:0 14px 40px rgba(var(--halo),.45); }
svg.grafica{ position:absolute; overflow:visible; }
.cierre{ position:absolute; inset:0; pointer-events:none; }
.cierre > *{ position:absolute; left:0; top:0; }
.logo{ width:200px; height:200px; border-radius:54px; display:grid; place-items:center; background:var(--acento); color:var(--fondo); font:800 110px var(--fuente); overflow:hidden; box-shadow:0 40px 100px rgba(var(--halo),.4); }
.logo img{ width:100%; height:100%; object-fit:cover; }
.marca{ font:700 96px var(--fuente); letter-spacing:-.04em; color:var(--tinta); white-space:nowrap; }
.lema{ font:400 54px var(--serif); font-style:italic; color:var(--acento); white-space:nowrap; }
</style>
</head><body>
<script id="params" type="application/json">
{
  "formato": "9x16",
  "duracion": 9,
  "fondo": "#141210",
  "tinta": "#F3EBE2",
  "acento": "#D97757",
  "etiqueta": "Visualizaciones *este mes*",
  "valor": 3.4,
  "decimales": 1,
  "prefijo": "",
  "sufijo": "M",
  "comparativa": "+212 % frente al mes pasado",
  "grafico": "ambos",
  "datos": [22, 30, 27, 41, 38, 52, 49, 66, 71, 88],
  "etiquetasDatos": ["E", "F", "M", "A", "M", "J", "J", "A", "S", "O"],
  "chip": "Récord",
  "marca": "Viegas Estudio",
  "lema": "Crece con contenido que se ve",
  "logo": ""
}
</script>
<script>
const P = JSON.parse(document.getElementById('params').textContent);
for (const [c, v] of new URLSearchParams(location.search)) {
  if (c === 'ver') continue; const d = P[c];
  P[c] = typeof d === 'number' ? parseFloat(v) : (d && typeof d === 'object') ? (() => { try { return JSON.parse(v); } catch { return v.split(','); } })() : v;
}
const FMT = (location.hash.match(/(16x9|9x16)/) || [0, P.formato || '9x16'])[1];
const [W, H] = FMT === '16x9' ? [1920, 1080] : [1080, 1920], VERT = H > W;
const raiz = document.documentElement.style;
const hexRgb = (h) => { const n = parseInt(h.replace('#', '').replace(/^(.)(.)(.)$/, '$1$1$2$2$3$3'), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
if (P.acento) { raiz.setProperty('--acento', P.acento); raiz.setProperty('--halo', hexRgb(P.acento)); }
if (P.fondo) raiz.setProperty('--fondo', P.fondo);
if (P.tinta) raiz.setProperty('--tinta', P.tinta);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const md = (s) => esc(s).replace(/\*([^*]+)\*/g, '<b>$1</b>');

escena({ duracion: P.duracion, ancho: W, alto: H }, (MG) => {
  const { k, lerp, curvas: C, DT, MB } = MG, D = P.duracion;
  const mancha = MG.el(`<div class="mancha" style="width:900px;height:900px;opacity:.22"></div>`); MG.mundo.prepend(mancha);

  // ---- bloque cifra
  const eti = MG.el(`<div class="eti">${md(P.etiqueta)}</div>`);
  const num = MG.el(`<div class="num"></div>`);
  const comp = MG.el(`<div class="comp"><i>↑</i>${esc(P.comparativa)}</div>`);
  if (!VERT) num.style.fontSize = '300px';

  // ---- gráfico
  const datos = (P.datos || []).map(Number), n = datos.length, mx = Math.max(...datos);
  const G = VERT ? { x: 90, y: 900, w: 900, h: 560 } : { x: 1000, y: 200, w: 780, h: 640 };
  const panel = MG.el(`<div class="panel" style="width:${G.w}px;height:${G.h}px"></div>`);
  const pad = 56, aw = G.w - pad * 2, ah = (G.h - pad * 2 - 40) * .84, paso = aw / n, bw = paso * .62;
  const verBarras = P.grafico !== 'linea', verLinea = P.grafico !== 'barras';
  const barras = datos.map((v, i) => { const b = document.createElement('div'); b.className = 'barra' + (i === n - 1 ? ' top' : '');
    b.style.cssText += `left:${pad + i * paso + (paso - bw) / 2}px;width:${bw}px;height:${ah * v / mx}px;bottom:${pad + 40}px`; if (!verBarras) b.style.display = 'none'; panel.appendChild(b); return b; });
  const ejes = (P.etiquetasDatos || []).slice(0, n).map((s, i) => { const e = document.createElement('div'); e.className = 'ejeT';
    e.style.cssText += `left:${pad + i * paso}px;width:${paso}px;bottom:${pad - 4}px`; e.textContent = s; panel.appendChild(e); return e; });
  const pts = datos.map((v, i) => [pad + i * paso + paso / 2, G.h - pad - 40 - ah * v / mx - (verBarras ? 26 : 0)]);
  const dPath = pts.map((p, i) => {
    if (!i) return `M${p[0]},${p[1]}`; const a = pts[i - 1], cx = (a[0] + p[0]) / 2; return `C${cx},${a[1]} ${cx},${p[1]} ${p[0]},${p[1]}`; }).join(' ');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'grafica'); svg.setAttribute('width', G.w); svg.setAttribute('height', G.h);
  svg.innerHTML = `<defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="var(--tinta)" stop-opacity=".5"/><stop offset="1" stop-color="var(--acento)"/></linearGradient></defs>
    <path d="${dPath}" fill="none" stroke="url(#gl)" stroke-width="7" stroke-linecap="round"/><circle r="14" fill="var(--acento)"/><circle r="30" fill="var(--acento)" opacity=".25"/>`;
  if (!verLinea) svg.style.display = 'none';
  panel.appendChild(svg);
  const camino = svg.querySelector('path'), LL = camino.getTotalLength(), puntos = svg.querySelectorAll('circle');
  camino.style.strokeDasharray = LL;
  const chip = MG.el(`<div class="chip">${esc(P.chip)}</div>`);

  // ---- cierre (fuera de la cámara: el «zoom a través» no lo afecta)
  const capa = document.createElement('div'); capa.className = 'cierre'; document.body.appendChild(capa);
  const ini = (P.marca || '·').trim()[0].toUpperCase();
  const logo = MG.el(`<div class="logo">${P.logo ? `<img src="${P.logo}">` : ini}</div>`, capa);
  const marca = MG.el(`<div class="marca">${esc(P.marca)}</div>`, capa);
  const lema = MG.el(`<div class="lema">${esc(P.lema)}</div>`, capa);

  const tZ = D - 2.7, tC = tZ + .55;
  let L = null;
  return (t) => {
    if (!L) {
      const bx = VERT ? (W - Math.max(num.offsetWidth, 600)) / 2 : 150;
      L = { cx: VERT ? W / 2 : 150, ey: VERT ? 290 : 250, ny: VERT ? 360 : 330, cy: VERT ? 680 : 680,
        topX: G.x + pad + (n - 1) * paso + paso / 2, topY: G.y + G.h - pad - 40 - ah };
    }
    // ---- cámara: deriva continua + empuje final hacia la barra récord y «zoom a través»
    const pz = C.entradaCubica(k(t, tZ, tC + .1));
    const z = lerp(1, 1.07, C.suave(t / D)) * (1 + 7 * pz);
    MG.vista.style.transformOrigin = `${L.topX}px ${L.topY + 60}px`;
    MG.vista.style.transform = `scale(${z}) translate(${Math.sin(t * .5) * 10}px, ${Math.cos(t * .4) * 8}px)`;
    MG.vista.style.filter = pz > 0 ? `blur(${pz * 18}px)` : '';
    MG.vista.style.opacity = 1 - C.entradaCubica(k(t, tC - .15, tC + .1));
    MG.pon(mancha, (VERT ? 100 : 900) + Math.sin(t * .35) * 160, (VERT ? 900 : 200) + Math.cos(t * .3) * 120);

    // ---- cifra: etiqueta rápida, número con contador (frenada salidaExpo), comparativa con rebote
    const cen = (el, y, e) => MG.pon(el, (VERT ? (W - el.offsetWidth) / 2 : L.cx) + e.x, y + e.y, e.s);
    cen(eti, L.ey, MG.entra(eti, t, .15, { d: .55, dy: 40, curva: 'salidaQuint', base: 6 }));
    MG.contador(num, t, .35, 2.6, 0, P.valor, { decimales: P.decimales, curva: 'salidaExpo', prefijo: P.prefijo });
    num.innerHTML = num.textContent + `<span>${esc(P.sufijo)}</span>`;
    cen(num, L.ny, MG.entra(num, t, .3, { d: .8, dy: 160, escala0: .82, curva: 'salidaExpo', base: 14 }));
    cen(comp, L.ny + num.offsetHeight + 40, MG.entra(comp, t, 2.2, { d: .6, dx: VERT ? 0 : -80, dy: VERT ? 60 : 0, curva: 'rebote', base: 5 }));

    // ---- gráfico: el panel sube, barras escalonadas (cada una su curva), línea que se dibuja
    const ep = MG.entra(panel, t, .9, { d: .8, dy: VERT ? 260 : 0, dx: VERT ? 0 : 260, escala0: .94, curva: 'salidaQuint', base: 8 });
    MG.pon(panel, G.x + ep.x, G.y + ep.y, ep.s);
    barras.forEach((b, i) => { const a = 1.3 + i * .09, cv = i % 3 === 0 ? C.salidaExpo : i % 3 === 1 ? C.salidaQuint : C.reboteSuave;
      const p = cv(k(t, a, a + (i % 3 === 2 ? .9 : .6))); b.style.transform = `scaleY(${Math.max(0, p)})`; b.style.opacity = Math.min(1, p * 2); });
    ejes.forEach((e, i) => { e.style.opacity = C.salidaCubica(k(t, 1.3 + i * .09, 1.7 + i * .09)); });
    const pl = C.entradaSalidaQuint(k(t, 1.7, 3.5));
    camino.style.strokeDashoffset = LL * (1 - pl);
    const pt = camino.getPointAtLength(LL * pl);
    puntos.forEach((c, i) => { c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.style.opacity = pl > 0 ? 1 : 0;
      if (i) c.setAttribute('r', 22 + 10 * Math.sin(t * 6)); });
    // chip récord: cae sobre la barra con rebote fuerte
    const ec = MG.entra(chip, t, 3.5, { d: .6, dy: -120, escala0: .5, curva: 'reboteFuerte', base: 6 });
    MG.pon(chip, L.topX - chip.offsetWidth / 2 - (L.topX + chip.offsetWidth / 2 > W - 40 ? L.topX + chip.offsetWidth / 2 - W + 40 : 0) + ep.x,
      L.topY - chip.offsetHeight - (verLinea ? 70 : 30) + ec.y + ep.y, ec.s);

    // ---- cierre: llega desde el fondo (escala grande → 1) con desenfoque que se aclara
    const yb = (H - (200 + 50 + 110 + 20 + 70)) / 2;
    const el1 = MG.entra(logo, t, tC, { d: .7, dy: 0, escala0: 2.4, curva: 'salidaExpo', base: 20 });
    MG.pon(logo, (W - 200) / 2, yb, el1.s, `rotate(${-12 * (1 - C.salidaQuint(k(t, tC, tC + .9)))}deg)`);
    const e2 = MG.entra(marca, t, tC + .2, { d: .6, dy: 70, curva: 'salidaQuint', base: 8 });
    MG.pon(marca, (W - marca.offsetWidth) / 2, yb + 250 + e2.y);
    const e3 = MG.entra(lema, t, tC + .4, { d: .7, dy: 50, curva: 'rebote', base: 5 });
    MG.pon(lema, (W - lema.offsetWidth) / 2, yb + 380 + e3.y);
    capa.style.transform = `scale(${1 + .04 * k(t, tC, D)})`; capa.style.transformOrigin = '50% 50%';
  };
});
</script>
</body></html>
