<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla de lanzamiento «lanz-antes-despues» · Viegas IA · Motion Lab
     Comparativa antes/después: una tarjeta grande con las dos imágenes superpuestas y una cortinilla vertical (línea + tirador)
     que barre de lado a lado con frenadas suaves y rebote, etiquetas «Antes» / «Después» que se encienden según el lado que
     domina, titular palabra a palabra, dato de resultado que cuenta y «zoom a través» del tirador hacia el cierre con logo.
     Cambia "imagenAntes" / "imagenDespues" (ruta o URL; "" = muestra generada en CSS), "etiquetas", "titulo" (*palabra* = acento),
     "dato" ({antes, despues, texto}), colores ("fondo", "tinta", "acento"), "marca", "lema" y "logo" (ruta o "" = inicial).
     Formato por hash: #9x16 (Reels, por defecto) · #16x9 (YouTube). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=block">
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<style>
:root{ --fuente:'Inter Tight','Inter','Segoe UI',system-ui,sans-serif; --serif:'Instrument Serif','Times New Roman',serif;
  --fondo:#141210; --tinta:#F3EDE4; --acento:#D97757; --halo:217,119,87; }
html,body{ background:var(--fondo); }
.mg-fondo{ background:radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--fondo) 80%, #fff) 0%, var(--fondo) 60%); }
.mg-fondo::after{ content:''; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.06) 1.5px, transparent 1.6px); background-size:44px 44px; }
.mancha{ position:absolute; border-radius:50%; filter:blur(140px); pointer-events:none; }
.mg-mundo > *{ position:absolute; left:0; top:0; }
.grupo{ width:var(--ancho); height:var(--alto); }
.grupo > *{ position:absolute; left:0; top:0; }
em{ font-family:var(--serif); font-style:italic; font-weight:400; color:var(--acento); letter-spacing:-.01em; }
.tit{ font:700 104px/1.02 var(--fuente); letter-spacing:-.045em; color:var(--tinta); }
.tit span{ display:inline-block; }
.marco{ border-radius:44px; overflow:hidden; box-shadow:0 50px 120px rgba(0,0,0,.55), 0 0 0 1.5px rgba(255,255,255,.08); background:#222; }
.marco .capa{ position:absolute; inset:0; }
.marco img{ width:100%; height:100%; object-fit:cover; display:block; }
/* muestras generadas (si no hay imágenes) */
.mAntes{ background:#3A3734; filter:saturate(.2); }
.mAntes .b{ position:absolute; height:26px; border-radius:6px; background:#5A5551; }
.mAntes .p{ position:absolute; width:120px; height:84px; border-radius:10px; background:#4A4642; transform:rotate(-6deg); }
.mDesp{ background:linear-gradient(150deg, color-mix(in srgb, var(--acento) 70%, #2a0f05), #1E1714 70%); }
.mDesp .c{ position:absolute; border-radius:26px; background:rgba(255,255,255,.1); border:1.5px solid rgba(255,255,255,.18); backdrop-filter:blur(8px); }
.mDesp .bar{ position:absolute; bottom:0; width:13%; border-radius:12px 12px 0 0; background:linear-gradient(var(--tinta), color-mix(in srgb, var(--tinta) 40%, var(--acento))); }
.cort{ position:absolute; top:0; width:6px; margin-left:-3px; background:var(--tinta); box-shadow:0 0 30px rgba(var(--halo),.8); }
.tir{ position:absolute; width:104px; height:104px; margin:-52px 0 0 -52px; border-radius:50%; background:var(--tinta); display:grid; place-items:center;
  box-shadow:0 14px 40px rgba(0,0,0,.45), 0 0 0 10px rgba(var(--halo),.25); color:var(--fondo); font:700 40px var(--fuente); }
.eti{ padding:14px 26px; border-radius:99px; font:700 28px var(--fuente); letter-spacing:.14em; text-transform:uppercase; background:rgba(20,18,16,.6); color:var(--tinta); border:1.5px solid rgba(255,255,255,.2); backdrop-filter:blur(10px); }
.eti.on{ background:var(--acento); border-color:transparent; color:#fff; }
.dato{ display:flex; align-items:center; gap:26px; padding:26px 40px; border-radius:30px; background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.1); color:var(--tinta); white-space:nowrap; }
.dato s{ font:500 52px var(--fuente); opacity:.45; text-decoration-thickness:4px; text-decoration-color:var(--acento); }
.dato b{ font:800 74px var(--fuente); letter-spacing:-.04em; color:var(--acento); font-variant-numeric:tabular-nums; }
.dato i{ font:500 30px/1.2 var(--fuente); font-style:normal; opacity:.7; }
.logo{ width:190px; height:190px; border-radius:52px; display:grid; place-items:center; overflow:hidden; color:#fff; font:800 104px var(--fuente);
  background:linear-gradient(160deg, color-mix(in srgb, var(--acento) 60%, #fff), var(--acento)); box-shadow:0 40px 100px rgba(var(--halo),.45); }
.logo img{ width:100%; height:100%; object-fit:contain; }
.marca{ font:800 128px/1 var(--fuente); letter-spacing:-.05em; color:var(--tinta); text-align:center; white-space:nowrap; }
.lema{ font:500 42px var(--fuente); color:color-mix(in srgb, var(--tinta) 60%, transparent); text-align:center; white-space:nowrap; }
</style>
</head><body>
<script id="params" type="application/json">
{
  "formato": "9x16",
  "duracion": 9,
  "fondo": "#141210",
  "tinta": "#F3EDE4",
  "acento": "#D97757",
  "titulo": "De esto *a esto* en una tarde",
  "etiquetas": ["Antes", "Después"],
  "imagenAntes": "",
  "imagenDespues": "",
  "dato": { "antes": "3 h", "despues": 12, "sufijo": " min", "texto": "para editar cada reel" },
  "marca": "Viegas Estudio",
  "lema": "Edita con Claude Code",
  "logo": ""
}
</script>
<script>
const P = JSON.parse(document.getElementById('params').textContent);
for (const [c, v] of new URLSearchParams(location.search)) {
  if (c === 'ver') continue; const d = P[c];
  P[c] = typeof d === 'number' ? parseFloat(v) : (d && typeof d === 'object') ? (() => { try { return JSON.parse(v); } catch { return v.split(','); } })() : v;
}
const FMT = (location.hash.match(/(16x9|9x16)/) || [0, P.formato || '9x16'])[1];
const [W, H] = FMT === '16x9' ? [1920, 1080] : [1080, 1920], VERT = H > W;
const raiz = document.documentElement.style;
const hexRgb = (h) => { const n = parseInt(h.replace('#', '').replace(/^(.)(.)(.)$/, '$1$1$2$2$3$3'), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
['fondo', 'tinta', 'acento'].forEach((c) => P[c] && raiz.setProperty('--' + c, P[c]));
if (P.acento) raiz.setProperty('--halo', hexRgb(P.acento));
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const palabras = (s) => esc(s).replace(/\*([^*]+)\*/g, (_, g) => g.split(' ').map((w) => `\u0001${w}`).join(' '))
  .split(' ').map((w) => w.startsWith('\u0001') ? `<span><em>${w.slice(1)}</em></span>` : `<span>${w}</span>`).join(' ');

escena({ duracion: P.duracion, ancho: W, alto: H }, (MG) => {
  const { k, lerp, curvas: C, DT, MB } = MG, D = P.duracion;
  const manchas = [[.2, .25, 820, .22], [.85, .75, 900, .16]].map(([x, y, r, a], i) => {
    const m = MG.el(`<div class="mancha" style="width:${r}px;height:${r}px;background:var(--acento);opacity:${a}"></div>`); m._m = { x: x * W - r / 2, y: y * H - r / 2, f: .25 + i * .07 }; return m; });
  const grupo = MG.el('<div class="grupo"></div>');

  // ---- tarjeta comparativa
  const MW = VERT ? 920 : 1000, MH = VERT ? 820 : 680;
  const MX = VERT ? (W - MW) / 2 : W - MW - 130, MY = VERT ? 490 : (H - MH) / 2 + 10;
  const muestraA = () => { let h = ''; for (let i = 0; i < 9; i++) h += `<div class="b" style="left:${60 + (i % 3) * 30}px;top:${80 + i * (MH - 160) / 9}px;width:${MW * (.35 + ((i * 37) % 40) / 100)}px"></div>`;
    for (let i = 0; i < 4; i++) h += `<div class="p" style="left:${MW * (.55 + (i % 2) * .2)}px;top:${MH * (.15 + i * .2)}px;transform:rotate(${(i % 2 ? 7 : -9)}deg)"></div>`; return h; };
  const muestraD = () => `<div class="c" style="left:7%;top:7%;width:86%;height:22%"></div><div class="c" style="left:7%;top:33%;width:41%;height:24%"></div>
    <div class="c" style="left:52%;top:33%;width:41%;height:24%"></div><div class="c" style="left:7%;top:61%;width:86%;height:32%;overflow:hidden">
    ${[42, 58, 50, 72, 66, 88].map((h, i) => `<div class="bar" style="left:${5 + i * 15.5}%;height:${h}%"></div>`).join('')}</div>`;
  const capaA = P.imagenAntes ? `<img src="${P.imagenAntes}" alt="">` : `<div class="capa mAntes">${muestraA()}</div>`;
  const capaD = P.imagenDespues ? `<img src="${P.imagenDespues}" alt="">` : `<div class="capa mDesp">${muestraD()}</div>`;
  const marco = MG.el(`<div class="marco" style="width:${MW}px;height:${MH}px"><div class="capa">${capaA}</div><div class="capa dsp">${capaD}</div>
    <div class="cort" style="height:${MH}px"></div><div class="tir" style="top:${MH / 2}px">⟷</div></div>`, grupo);
  const dsp = marco.querySelector('.dsp'), cort = marco.querySelector('.cort'), tir = marco.querySelector('.tir');
  const et = (P.etiquetas || ['Antes', 'Después']).map((s) => MG.el(`<div class="eti">${esc(s)}</div>`, grupo));

  // ---- titular y dato
  const tit = MG.el(`<div class="tit">${palabras(P.titulo)}</div>`, grupo);
  const TW = VERT ? W - 160 : 560; tit.style.width = TW + 'px'; tit.style.fontSize = (VERT ? 100 : 96) + 'px';
  const trozos = [...tit.querySelectorAll(':scope > span')];
  const dt = P.dato || {};
  const dato = MG.el(`<div class="dato"><s>${esc(dt.antes)}</s><span style="font:600 44px var(--fuente);opacity:.5">→</span><b>0</b><i>${esc(dt.texto || '')}</i></div>`, grupo);
  const num = dato.querySelector('b');
  if (!VERT) { dato.style.flexWrap = 'wrap'; dato.style.width = '560px'; dato.style.whiteSpace = 'normal'; }

  // ---- cierre
  const ini = (P.marca || '·').trim()[0].toUpperCase();
  const logo = MG.el(`<div class="logo">${P.logo ? `<img src="${P.logo}" alt="">` : ini}</div>`);
  const marca = MG.el(`<div class="marca">${esc(P.marca)}</div>`), lema = MG.el(`<div class="lema">${esc(P.lema)}</div>`);

  // ---- tiempos
  const tT = .15, tM = .55, tBar = 1.4, tDato = 4.6, tZ = D - 2.9, tC = tZ + .45;
  // posición de la cortinilla (0 = todo «después», 1 = todo «antes»): barre a la izquierda rápido y frena, rebota, vuelve al centro
  const pos = (u) => {
    if (u < tBar) return 1;
    const a = C.salidaExpo(k(u, tBar, tBar + 1.1)), b = C.reboteSuave(k(u, tBar + 1.5, tBar + 2.4)), c = C.afterEffects75(k(u, tBar + 2.9, tBar + 3.8));
    return lerp(lerp(lerp(1, .12, a), .78, b), .5, c);
  };

  let L = null;
  return (t) => {
    if (!L) L = { th: tit.offsetHeight, dw: dato.offsetWidth, dh: dato.offsetHeight, lw: marca.offsetWidth, lmw: lema.offsetWidth };
    // ---- cámara: deriva continua + zoom lento
    const z = lerp(1.0, 1.07, C.suave(t / D));
    MG.vista.style.transformOrigin = `${W / 2}px ${H / 2}px`;
    MG.vista.style.transform = `scale(${z}) translate(${Math.sin(t * .5) * 10}px, ${Math.cos(t * .37) * 12}px)`;
    manchas.forEach((m, i) => { const o = m._m; MG.pon(m, o.x + Math.sin(t * o.f + i) * 140, o.y + Math.cos(t * o.f * .8 + i * 2) * 100); });

    // ---- zoom a través: el grupo acelera hacia el tirador y se abre (entrada cúbica = salida acelerando)
    const pz = C.entradaCubica(k(t, tZ, tZ + .75)), pzq = C.entradaCubica(k(t - DT, tZ, tZ + .75));
    const cx = MX + MW * pos(t), cy = MY + MH / 2, sz = 1 + 9 * pz;
    grupo.style.transformOrigin = `${cx}px ${cy}px`;
    grupo.style.transform = `scale(${sz})`;
    grupo.style.opacity = 1 - C.entradaCubica(k(t, tZ + .35, tZ + .75));
    MG.desenfoca(grupo, pz * 10, pz * 10 + Math.abs(9 * (pz - pzq) / DT) * .4);

    // ---- titular: palabras desde abajo, curvas alternas
    const TX = VERT ? 80 : 130, TY = VERT ? 250 : (MY + 30);
    MG.pon(tit, TX, TY);
    trozos.forEach((s, i) => { const e = MG.entra(s, t, tT + i * .07, { d: .6, dy: 90, escala0: 1, curva: i % 2 ? 'salidaQuint' : 'salidaExpo', base: 6 });
      s.style.transform = `translateY(${e.y}px)`; });

    // ---- tarjeta: sube con frenada suave y un pelín de giro que se endereza
    const em = MG.entra(marco, t, tM, { d: .9, dy: 260, escala0: .88, curva: 'salidaQuint', base: 10 });
    MG.pon(marco, MX, MY + em.y, em.s, `rotate(${3 * (1 - em.p)}deg)`);
    const p = pos(t), pq = pos(t - DT);
    dsp.style.clipPath = `inset(0 0 0 ${p * 100}%)`;
    cort.style.left = (p * MW) + 'px'; tir.style.left = (p * MW) + 'px';
    cort.style.opacity = tir.style.opacity = C.salidaCubica(k(t, tBar - .3, tBar));
    MG.desenfoca(tir, Math.abs((p - pq) * MW / DT) * MB, 0);
    tir.style.transform = `scale(${1 + .12 * Math.min(1, Math.abs((p - pq) * MW / DT) / 2500)})`;

    // ---- etiquetas: la del lado que domina se enciende
    const yE = MY + 34;
    et.forEach((e, i) => { const en = MG.entra(e, t, tM + .45 + i * .12, { d: .55, dx: i ? 120 : -120, dy: 0, escala0: .9, curva: 'rebote', base: 4 });
      const x = i ? MX + MW - e.offsetWidth - 34 : MX + 34;
      MG.pon(e, x + en.x, yE + em.y + en.y, en.s); e.classList.toggle('on', i ? p < .5 : p >= .5); });

    // ---- dato: entra con rebote y cuenta
    const ed = MG.entra(dato, t, tDato, { d: .6, dy: 120, escala0: .8, curva: 'rebote', base: 6 });
    const DX = VERT ? (W - L.dw) / 2 : TX, DY = VERT ? MY + MH + 30 : TY + L.th + 60;
    MG.pon(dato, DX, DY + ed.y, ed.s);
    MG.contador(num, t, tDato + .1, tDato + 1.3, 0, +dt.despues || 0, { sufijo: dt.sufijo || '', curva: 'salidaQuint' });

    // ---- cierre: llega desde lejos (pequeño y desenfocado) mientras el grupo se abre
    const bloque = 190 + 60 + 128 + 36 + 50, y0 = (H - bloque) / 2;
    const el = MG.entra(logo, t, tC, { d: .7, dy: 0, escala0: .3, curva: 'reboteFuerte', base: 18 });
    MG.pon(logo, (W - 190) / 2, y0, el.s, `rotate(${-14 * (1 - C.salidaQuint(k(t, tC, tC + .9)))}deg)`);
    const ea = MG.entra(marca, t, tC + .2, { d: .7, dy: 0, escala0: .6, curva: 'salidaExpo', base: 14 });
    MG.pon(marca, (W - L.lw) / 2, y0 + 250, ea.s); marca.style.transformOrigin = '50% 50%';
    const eb = MG.entra(lema, t, tC + .42, { d: .6, dy: 40, escala0: 1, curva: 'salidaQuint', base: 5 });
    MG.pon(lema, (W - L.lmw) / 2, y0 + 250 + 128 + 36 + eb.y);
    if (t < tC) { logo.style.opacity = marca.style.opacity = lema.style.opacity = 0; }
  };
});
</script>
</body></html>
