<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla de lanzamiento «lanz-notificaciones» · Viegas IA · Motion Lab
     Notificaciones de cristal estilo iOS sobre un fondo degradado lavanda/azul desenfocado (pantalla de bloqueo con la hora):
     caen una a una y se apilan con física suave (cada llegada empuja las de abajo con un muelle), el cristal desenfoca de verdad
     lo que tiene detrás (backdrop-filter), la última se expande con su detalle y su botón mientras las demás se recogen en una
     pila; todo sale hacia arriba acelerando y cierra el titular con el icono de la app.
     Cambia "app" ({nombre, icono: ruta o "" = inicial}), "notificaciones" ([{titulo, texto, hora}], 2–5), "detalle" y "boton"
     (los de la notificación que se expande), "titular" (*palabra* = acento), "acento", "degradado" (3 colores), "hora", "fecha".
     Formato por hash: #9x16 (Reels, por defecto) · #16x9 (YouTube). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=block">
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<style>
:root{ --fuente:'Inter Tight','Inter','Segoe UI',system-ui,sans-serif; --serif:'Instrument Serif','Times New Roman',serif;
  --texto:#17142B; --mute:#5D5A72; --acento:#6D5BFF; --halo:109,91,255; --g1:#E7E1FF; --g2:#D6E4FF; --g3:#F5E8FF; }
html,body{ background:var(--g1); }
.mg-fondo{ background:linear-gradient(160deg, var(--g1), var(--g2) 55%, var(--g3)); }
/* manchas de color muy desenfocadas (gaussiano amplio, nunca cuadriculado): lo que el cristal desenfoca detrás */
.mancha{ position:absolute; border-radius:50%; filter:blur(120px); pointer-events:none; }
.mg-vista{ perspective:none; }
.mg-mundo{ transform-style:flat; }   /* plano: así el backdrop-filter de las notificaciones ve el fondo */
.mg-mundo > *{ position:absolute; left:0; top:0; width:max-content; }
.mg-mundo em{ font-family:var(--serif); font-style:italic; font-weight:400; letter-spacing:-.01em; color:var(--acento); }
.reloj{ text-align:center; color:rgba(255,255,255,.92); text-shadow:0 10px 40px rgba(70,50,160,.18); }
.reloj small{ display:block; font:500 40px var(--fuente); letter-spacing:-.01em; color:rgba(40,30,90,.55); }
.reloj b{ display:block; font:600 250px/1 var(--fuente); letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
/* notificación de cristal */
.noti{ border-radius:46px; padding:30px 34px 32px 30px; display:flex; gap:24px; overflow:hidden;
  background:rgba(255,255,255,.46); -webkit-backdrop-filter:blur(34px) saturate(170%); backdrop-filter:blur(34px) saturate(170%);
  border:1.5px solid rgba(255,255,255,.7); box-shadow:0 24px 60px rgba(60,40,140,.16), inset 0 1px 0 rgba(255,255,255,.8); }
.ico{ width:84px; height:84px; border-radius:22px; flex:none; display:grid; place-items:center; overflow:hidden; color:#fff; font:700 44px var(--fuente);
  background:linear-gradient(160deg, color-mix(in srgb, var(--acento) 55%, #fff), var(--acento)); box-shadow:0 6px 16px rgba(var(--halo),.3); }
.ico img{ width:100%; height:100%; object-fit:cover; }
.cuerpo{ flex:1; min-width:0; }
.cab{ display:flex; align-items:baseline; gap:16px; font:500 26px var(--fuente); color:var(--mute); letter-spacing:.01em; }
.cab span{ text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
.cab i{ margin-left:auto; font-style:normal; }
.noti h3{ margin-top:8px; font:600 36px/1.2 var(--fuente); color:var(--texto); letter-spacing:-.015em; }
.noti p{ margin-top:4px; font:400 33px/1.3 var(--fuente); color:#2F2C45; letter-spacing:-.005em; }
.extra{ height:0; overflow:hidden; }
.extra p{ padding-top:14px; color:var(--mute); }
.extra .btn{ margin-top:24px; display:flex; gap:14px; }
.extra .btn b{ flex:1; text-align:center; padding:22px 0; border-radius:24px; font:600 32px var(--fuente); background:rgba(255,255,255,.6); color:var(--texto); }
.extra .btn b:last-child{ background:var(--acento); color:#fff; box-shadow:0 10px 26px rgba(var(--halo),.35); }
/* cierre */
.icoG{ width:190px; height:190px; border-radius:50px; font-size:100px; box-shadow:0 40px 90px rgba(var(--halo),.35), inset 0 1px 0 rgba(255,255,255,.5); }
.tit{ font:600 120px/1.03 var(--fuente); letter-spacing:-.045em; color:var(--texto); text-align:center; }
.tit .mg-trozo{ padding:0 .02em; }
.app{ font:600 40px var(--fuente); color:var(--mute); letter-spacing:-.01em; text-align:center; }
</style>
</head><body>
<script id="params" type="application/json">
{
  "formato": "9x16",
  "duracion": 10,
  "acento": "#6D5BFF",
  "degradado": ["#E7E1FF", "#D6E4FF", "#F6E6FF"],
  "hora": "9:41",
  "fecha": "sábado, 25 de octubre",
  "app": { "nombre": "Duet", "icono": "" },
  "notificaciones": [
    { "titulo": "Tu agenda está lista", "texto": "He movido la reunión de las 10 a las 12.", "hora": "hace 2 min" },
    { "titulo": "Correo respondido", "texto": "Le he dicho a Marta que el lunes le envías la propuesta.", "hora": "hace 1 min" },
    { "titulo": "Factura enviada", "texto": "Cliente: Estudio Norte · 1.250 €", "hora": "ahora" },
    { "titulo": "Vídeo editado", "texto": "Tu reel de hoy ya tiene cortes, subtítulos y música.", "hora": "ahora" }
  ],
  "detalle": "Duración 0:42 · exportado en 4K y listo para publicar en Instagram.",
  "boton": ["Ver", "Publicar"],
  "titular": "Tu asistente *trabaja por ti*"
}
</script>
<script>
// ---------------------------------------------------------------- parámetros: bloque params + ?clave=valor + formato por hash
const P = JSON.parse(document.getElementById('params').textContent);
for (const [c, v] of new URLSearchParams(location.search)) {
  if (c === 'ver') continue; const d = P[c];
  P[c] = typeof d === 'number' ? parseFloat(v) : (d && typeof d === 'object') ? (() => { try { return JSON.parse(v); } catch { return v.split(','); } })() : v;
}
const FMT = (location.hash.match(/(16x9|9x16)/) || [0, P.formato || '9x16'])[1];
const [W, H] = FMT === '16x9' ? [1920, 1080] : [1080, 1920], VERT = H > W;
const raiz = document.documentElement.style;
const hexRgb = (h) => { const n = parseInt(h.replace('#', '').replace(/^(.)(.)(.)$/, '$1$1$2$2$3$3'), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
if (P.acento) { raiz.setProperty('--acento', P.acento); raiz.setProperty('--halo', hexRgb(P.acento)); }
(P.degradado || []).slice(0, 3).forEach((c, i) => raiz.setProperty('--g' + (i + 1), c));
const md = (s) => String(s).replace(/\*([^*]+)\*/g, (_, g) => g.split(' ').map((w) => `<em>${w}</em>`).join(' '));
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

escena({ duracion: P.duracion, ancho: W, alto: H }, (MG) => {
  const { k, lerp, curvas: C, DT, MB } = MG, D = P.duracion;
  const app = P.app || {}, ini = (app.nombre || '·').trim()[0].toUpperCase();
  const icono = (cl = '') => `<div class="ico ${cl}">${app.icono ? `<img src="${app.icono}" alt="">` : ini}</div>`;

  // ---- fondo: manchas de color que derivan (dan vida al degradado y al cristal)
  const capa = document.querySelector('.mg-fondo');
  const manchas = [['var(--acento)', .2, .3, 760, .32], ['#7FB2FF', .85, .2, 820, .45], ['#FF9ED8', .75, .85, 760, .30], ['#9F8CFF', .15, .9, 700, .35]].map(([c, x, y, r, a], i) => {
    const m = MG.el(`<div class="mancha" style="width:${r}px;height:${r}px;background:${c};opacity:${a}"></div>`);
    m._m = { x: x * W - r / 2, y: y * H - r / 2, f: .22 + i * .05 }; MG.mundo.prepend(m); return m;
  });

  // ---- pantalla de bloqueo
  const reloj = MG.el(`<div class="reloj"><small>${esc(P.fecha)}</small><b>${esc(P.hora)}</b></div>`);

  // ---- notificaciones (la última es la que se expande)
  const lista = (P.notificaciones || []).slice(0, 5), n = lista.length;
  const NW = VERT ? 960 : 860;
  const botones = Array.isArray(P.boton) ? P.boton : [P.boton];
  const notis = lista.map((o, i) => MG.el(`<div class="noti" style="width:${NW}px">${icono()}<div class="cuerpo">
    <div class="cab"><span>${esc(app.nombre)}</span><i>${esc(o.hora)}</i></div><h3>${esc(o.titulo)}</h3><p>${esc(o.texto)}</p>
    ${i === n - 1 ? `<div class="extra"><p>${esc(P.detalle)}</p><div class="btn">${botones.map((b) => `<b>${esc(b)}</b>`).join('')}</div></div>` : ''}</div></div>`));
  const ultima = notis[n - 1], extra = ultima.querySelector('.extra');

  // ---- cierre
  const icoG = MG.el(icono('icoG'));
  const anchoTit = VERT ? W - 140 : 1500;
  const tit = MG.texto(md(P.titular), 'tit'); tit.style.width = anchoTit + 'px'; tit.style.fontSize = (VERT ? 124 : 132) + 'px';
  const nombre = MG.el(`<div class="app">${esc(app.nombre)}</div>`);

  // ---- tiempos (s): las llegadas se aceleran (ritmo), luego expansión, salida y titular
  const lleg = lista.map((_, i) => .7 + i * .95 - i * i * .06);
  const tExp = lleg[n - 1] + 1.15, tSal = tExp + 2.0, tTit = tSal + .55;

  let L = null;
  return (t) => {
    if (!L) {
      const hs = notis.map((e) => e.offsetHeight), hx = extra.scrollHeight, gap = VERT ? 20 : 16;
      // vertical: reloj arriba y pila debajo · horizontal: reloj a la izquierda y pila a la derecha
      const x = VERT ? (W - NW) / 2 : W - NW - 150;
      const top = VERT ? 640 : 96;
      L = { hs, hx, gap, x, top, relX: VERT ? (W - reloj.offsetWidth) / 2 : 150 + (W - NW - 300 - reloj.offsetWidth) / 2, relY: VERT ? 250 : (H - reloj.offsetHeight) / 2 };
    }
    // ---- cámara: zoom lento continuo + empuje hacia la notificación que se expande; nunca se para
    const pe = C.afterEffects75(k(t, tExp - .2, tExp + 1.1)), ps = C.entradaCubica(k(t, tSal - .2, tSal + .6));
    const z = lerp(1, 1.06, C.suave(t / D)) + .07 * pe * (1 - ps);
    MG.vista.style.transformOrigin = `${L.x + NW / 2}px ${L.top + 150}px`;
    MG.vista.style.transform = `scale(${z}) translate(${Math.sin(t * .4) * 8}px, ${Math.cos(t * .3) * 10 - 40 * pe * (1 - ps)}px)`;
    manchas.forEach((m, i) => { const o = m._m; MG.pon(m, o.x + Math.sin(t * o.f + i) * 120, o.y + Math.cos(t * o.f * .8 + i * 2) * 90); });

    // ---- reloj: aparece desenfocado y sube; al llegar el titular se va hacia arriba
    if (t < tSal) { const e = MG.entra(reloj, t, .05, { d: .9, dy: 50, escala0: .96, curva: 'salidaQuint', base: 14 }); MG.pon(reloj, L.relX, L.relY + e.y, e.s); }
    else { const p = C.entradaCubica(k(t, tSal, tSal + .5)); MG.pon(reloj, L.relX, L.relY - 160 * p, 1 + .05 * p); reloj.style.opacity = 1 - p; MG.desenfoca(reloj, p * 14, p * 22); }

    // ---- pila: la más nueva arriba; cada llegada empuja (con muelle) a las anteriores
    const lp = lleg.map((a) => C.rebote(k(t, a, a + .75 * 1.5)));          // progreso con rebote de cada llegada (se pasa y vuelve: física suave)
    const hExt = L.hx * C.rebote(k(t, tExp, tExp + .8 * 1.5));              // la última crece con un muelle
    extra.style.height = Math.max(0, hExt) + 'px';
    extra.style.opacity = C.salidaCubica(k(t, tExp + .15, tExp + .6));
    notis.forEach((el, i) => {
      // profundidad: cuántas más nuevas han llegado encima (fraccionario mientras llegan)
      let dy = 0, prof = 0;
      for (let j = i + 1; j < n; j++) { dy += lp[j] * (L.hs[j] + L.gap); prof += Math.max(0, Math.min(1, lp[j])); }
      if (i < n - 1) dy += hExt * lp[n - 1];
      let y = L.top + dy, s = 1 - .015 * prof, op = 1;
      // al expandirse la última, las demás se recogen en una pila bajo ella (desplazadas 22 px y más pequeñas)
      if (i < n - 1) {
        const d = n - 1 - i, yPila = L.top + L.hs[n - 1] + Math.max(0, hExt) - L.hs[i] + 26 * d;
        y = lerp(y, yPila, pe); s = lerp(s, 1 - .055 * d, pe); op = lerp(1, d > 2 ? 0 : 1 - .2 * d, pe);
      }
      el.style.zIndex = 10 + i;
      if (t < tSal + (n - 1 - i) * .06) {
        const e = MG.entra(el, t, lleg[i], { d: .75, dy: -260, escala0: .9, curva: 'rebote', base: 6 });
        MG.pon(el, L.x, y + e.y, e.s * s); el.style.opacity = Math.min(1, Math.max(0, e.p) * 1.8) * op;
      } else {   // salida: aceleran hacia arriba, escalonadas de la más nueva a la más vieja
        const a = tSal + (n - 1 - i) * .06, p = C.entradaCubica(k(t, a, a + .5)), q = C.entradaCubica(k(t - DT, a, a + .5));
        MG.pon(el, L.x, y - 700 * p, s * (1 + .04 * p)); el.style.opacity = op * (1 - p);
        MG.desenfoca(el, 2 + p * 6, Math.abs(700 * (p - q) / DT) * MB + p * 8);
      }
      el.style.transformOrigin = '50% 0';
    });

    // ---- cierre: el icono cae con rebote fuerte, el titular entra palabra a palabra con desenfoque
    const bloque = 190 + 60 + tit.offsetHeight + 40 + 50, y0 = (H - bloque) / 2;
    const e1 = MG.entra(icoG, t, tTit, { d: .7, dy: 220, escala0: .4, curva: 'reboteFuerte', base: 8 });
    MG.pon(icoG, (W - 190) / 2, y0 + e1.y, e1.s, `rotate(${-16 * (1 - C.salidaQuint(k(t, tTit, tTit + .9)))}deg)`);
    MG.pon(tit, (W - anchoTit) / 2, y0 + 250);
    tit.trozos.forEach((sp, i) => { const e = MG.entra(sp, t, tTit + .25 + i * .08, { d: .65, dy: 80, escala0: 1, curva: 'rebote', base: 6 });
      sp.style.display = 'inline-block'; sp.style.transform = `translateY(${e.y}px)`; });
    const e3 = MG.entra(nombre, t, tTit + .6 + tit.trozos.length * .08, { d: .6, dy: 40, curva: 'salidaQuint', base: 5 });
    MG.pon(nombre, (W - nombre.offsetWidth) / 2, y0 + 250 + tit.offsetHeight + 40 + e3.y);
  };
});
</script>
</body></html>
