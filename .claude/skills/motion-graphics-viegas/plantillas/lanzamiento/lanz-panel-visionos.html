<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla de lanzamiento «lanz-panel-visionos» · Viegas IA · Motion Lab
     Panel espacial de cristal esmerilado (lenguaje visionOS) flotando sobre una habitación real:
     1) el panel llega desde lejos con perspectiva 3D y parallax con el fondo; barra superior (avatar + saludo + asistente que escribe
        + conmutador Claro/Oscuro), barra lateral de iconos (16:9) y barra de pestañas abajo · 2) las tarjetas aparecen escalonadas y
        cada una hace algo (interruptores con muelle, temperatura que baja, música que avanza y cambia de canción, recordatorio que se
        marca, iconos que rebotan, cifra que cuenta) · 3) un cursor-mirada (círculo suave, como en visionOS) recorre el panel y
        resalta la tarjeta que mira · 4) cambia de pestaña con la píldora deslizándose · 5) el panel se aleja (salida inversa).
     El cristal es real: desenfoque del fondo (backdrop-filter) + refracción en los bordes (mapa de desplazamiento SVG) + borde
     especular que gira con la luz.
     Parámetros: "fondo" (ruta a foto o vídeo; vacío = salón cálido desenfocado dibujado), "desenfoqueFondo" (px), "saludo", "nombre",
     "avatar" (ruta; vacío = inicial), "asistente" (frase que se escribe), "pestanas" (lista), "pestanaFinal" (índice al que cambia),
     "tarjetas" (lista: {tipo: interruptor|temperatura|musica|lista|apps|cifra, titulo, ancho 1-2, alto 1-2, …datos}), "tema"
     ("claro" | "oscuro"), "acento", "duracion" (10-14 s).
     Formato por hash: #9x16 (Reels, por defecto) · #16x9 (YouTube). También ?clave=valor en la dirección. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=block">
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<style>
:root{
  --fuente:'SF Pro Display','Inter Tight','Inter','Segoe UI',system-ui,sans-serif;
  /* tema claro (por defecto): cristal blanquecino, texto casi negro */
  --vid:rgba(255,255,255,.20); --vid2:rgba(255,255,255,.30); --vid3:rgba(255,255,255,.52);
  --texto:#16171b; --mute:rgba(22,23,27,.56); --linea:rgba(255,255,255,.5); --pista:rgba(22,23,27,.16);
  --acento:#34C759; --halo:52,199,89; --fondo:#8d7764;
}
.oscuro{ --vid:rgba(28,28,34,.30); --vid2:rgba(255,255,255,.10); --vid3:rgba(255,255,255,.20);
  --texto:#F5F5F7; --mute:rgba(245,245,247,.62); --linea:rgba(255,255,255,.28); --pista:rgba(255,255,255,.18); }
html,body{ background:var(--fondo); }
/* el mundo NO es preserve-3d: el cristal (backdrop-filter) necesita un contexto plano; la perspectiva va en cada pieza */
.mg-mundo{ transform-style:flat; }
.mg-mundo > *{ position:absolute; left:0; top:0; }
.cap{ position:absolute; left:0; top:0; width:var(--ancho); height:var(--alto); overflow:hidden; }
.cap > *{ position:absolute; }
.sala{ inset:-8%; }
.sala > *{ position:absolute; }
.fondo-media{ left:-5%; top:-5%; width:110%; height:110%; object-fit:cover; }
.vineta{ inset:0; background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(30,18,8,.38)); }

.grupo{ transform-origin:0 0; }
.grupo > *{ position:absolute; }
/* cristal: desenfoque real del fondo + refracción + borde especular que gira */
.vidrio{ border-radius:56px; background:var(--vid); isolation:isolate;
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.14), 0 50px 110px rgba(20,10,0,.28), 0 12px 30px rgba(20,10,0,.14); }
.vidrio::before{ content:''; position:absolute; inset:0; border-radius:inherit; padding:2px; pointer-events:none;
  background:conic-gradient(from var(--ang,30deg), rgba(255,255,255,.95), rgba(255,255,255,.12) 22%, rgba(255,255,255,.55) 48%, rgba(255,255,255,.08) 72%, rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; }
.vidrio::after{ content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(var(--angB,150deg), rgba(255,255,255,.22), rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,.08)); }
.t{ font-family:var(--fuente); letter-spacing:-.02em; color:var(--texto); white-space:nowrap; }

/* barra superior */
.barra{ display:flex; align-items:center; gap:22px; padding:0 18px; border-radius:99px; }
.avatar{ width:68px; height:68px; border-radius:50%; flex:none; overflow:hidden; display:grid; place-items:center;
  background:linear-gradient(150deg,#f3c7a0,#b06a43); font:700 32px var(--fuente); color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.6); }
.avatar img{ width:100%; height:100%; object-fit:cover; }
.saludo{ font:600 34px var(--fuente); }
.asis{ flex:1; display:flex; align-items:center; gap:16px; height:64px; padding:0 22px 0 12px; border-radius:99px; background:var(--vid2); min-width:0; }
.orbe{ width:44px; height:44px; border-radius:50%; flex:none; background:conic-gradient(from var(--orb,0deg), #6fd3ff, #8a7dff, #ff8bd1, #ffd27a, #6fd3ff); filter:saturate(1.2); box-shadow:inset 0 0 8px rgba(255,255,255,.8); }
.asis .t{ font:500 26px var(--fuente); color:var(--mute); overflow:hidden; text-overflow:clip; }
.asis .caret{ display:inline-block; width:2.5px; height:1em; margin-left:2px; vertical-align:-.12em; background:var(--texto); border-radius:2px; }
.modo{ display:flex; gap:4px; padding:5px; border-radius:99px; background:var(--vid2); position:relative; flex:none; }
.modo span{ position:relative; z-index:1; display:flex; align-items:center; gap:8px; padding:10px 18px; font:600 23px var(--fuente); letter-spacing:-.02em; color:var(--mute); }
.modo span svg{ width:24px; height:24px; }
.modo i{ position:absolute; left:0; top:5px; height:calc(100% - 10px); border-radius:99px; background:rgba(255,255,255,.92); box-shadow:0 4px 12px rgba(0,0,0,.12); }
.campana{ width:64px; height:64px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--vid2); }
.campana svg{ width:30px; height:30px; color:var(--texto); }

/* barra lateral */
.lateral{ border-radius:99px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:22px 0; }
.lateral b{ width:62px; height:62px; border-radius:50%; display:grid; place-items:center; color:var(--texto); }
.lateral b svg{ width:30px; height:30px; }
.lateral b.on{ background:rgba(255,255,255,.92); color:#16171b; box-shadow:0 6px 16px rgba(0,0,0,.14); }

/* panel y tarjetas */
.panel{ border-radius:58px; }
.rejilla{ position:absolute; display:grid; grid-auto-flow:row dense; }
.tarj{ position:relative; border-radius:36px; background:var(--vid2); padding:24px 26px; overflow:hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 1px 0 rgba(0,0,0,.03); transform-origin:50% 50%; }
.tarj .brillo{ position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0;
  background:radial-gradient(160px 160px at var(--mx,50%) var(--my,50%), rgba(255,255,255,.55), rgba(255,255,255,0) 70%); }
.tarj h4{ margin:0; font:600 30px/1.1 var(--fuente); letter-spacing:-.02em; color:var(--texto); white-space:nowrap; }
.tarj p{ margin:6px 0 0; font:500 23px/1.25 var(--fuente); letter-spacing:-.01em; color:var(--mute); white-space:nowrap; }
.fila{ display:flex; align-items:center; justify-content:space-between; }
/* interruptor */
.sw{ width:96px; height:56px; border-radius:99px; background:var(--pista); position:relative; flex:none; }
.sw i{ position:absolute; left:4px; top:4px; width:48px; height:48px; border-radius:50%; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.22); }
.abajo{ position:absolute; left:26px; right:26px; bottom:22px; }
/* temperatura */
.grados{ font:600 108px/1 var(--fuente); letter-spacing:-.05em; color:var(--texto); display:flex; align-items:flex-start; }
.grados small{ font:500 44px var(--fuente); letter-spacing:-.02em; margin:8px 0 0 4px; color:var(--texto); }
.chev{ display:flex; flex-direction:column; gap:12px; }
.chev b{ width:60px; height:60px; border-radius:20px; display:grid; place-items:center; background:var(--vid3); color:var(--texto); }
.chev b svg{ width:28px; height:28px; }
.dato{ display:flex; justify-content:space-between; align-items:center; font:500 23px var(--fuente); letter-spacing:-.01em; color:var(--mute); padding:9px 0; }
.dato span:last-child{ padding:6px 14px; border-radius:12px; background:var(--vid3); color:var(--texto); font-weight:600; }
/* música */
.portada{ width:var(--port,88px); height:var(--port,88px); border-radius:20px; flex:none; overflow:hidden; position:relative; box-shadow:0 10px 24px rgba(0,0,0,.2); }
.portada img{ width:100%; height:100%; object-fit:cover; }
.mus-txt{ position:relative; overflow:hidden; height:76px; flex:1; margin-left:24px; }
.mus-txt > div{ position:absolute; left:0; top:0; }
.barraMus{ height:8px; border-radius:99px; background:var(--pista); position:relative; }
.barraMus i{ position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:var(--texto); }
.barraMus b{ position:absolute; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:var(--texto); }
.tiempos{ display:flex; justify-content:space-between; font:500 20px var(--fuente); color:var(--mute); margin-top:8px; font-variant-numeric:tabular-nums; }
.mandos{ display:flex; justify-content:center; gap:46px; align-items:center; margin-top:2px; color:var(--texto); }
.mandos svg{ width:30px; height:30px; display:block; }
.mandos .pp svg{ width:38px; height:38px; }
/* lista */
.item{ display:flex; align-items:center; gap:16px; font:500 25px var(--fuente); letter-spacing:-.01em; color:var(--texto); padding:7px 0; white-space:nowrap; position:relative; }
.item .cir{ width:34px; height:34px; border-radius:50%; flex:none; border:2.5px solid var(--mute); display:grid; place-items:center; }
.item .cir svg{ width:22px; height:22px; }
.item .tachado{ position:absolute; left:50px; top:50%; height:2.5px; background:var(--mute); }
.cuenta{ font:600 46px/1 var(--fuente); letter-spacing:-.04em; color:var(--texto); }
/* apps */
.apps{ display:flex; justify-content:space-between; gap:10px; }
.app{ display:flex; flex-direction:column; align-items:center; gap:10px; font:500 20px var(--fuente); letter-spacing:-.01em; color:var(--mute); }
.app i{ width:74px; height:74px; border-radius:22px; display:grid; place-items:center; box-shadow:0 8px 18px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.5); }
.app i svg{ width:40px; height:40px; color:#fff; }
/* cifra */
.cifra{ font:600 76px/1 var(--fuente); letter-spacing:-.04em; color:var(--texto); font-variant-numeric:tabular-nums; }
.cifra small{ font:500 32px var(--fuente); color:var(--mute); margin-left:8px; letter-spacing:-.02em; }
.barras{ display:flex; align-items:flex-end; gap:10px; height:96px; }
.barras i{ flex:1; border-radius:8px; background:var(--pista); }
.barras i.on{ background:var(--acento); }

/* pestañas */
.pestanas{ display:flex; align-items:center; gap:6px; padding:10px; border-radius:99px; }
.pestanas span{ position:relative; z-index:1; padding:16px 26px; font:600 26px var(--fuente); letter-spacing:-.02em; color:var(--mute); white-space:nowrap; }
.pestanas .pil{ position:absolute; z-index:0; top:10px; bottom:10px; left:0; border-radius:99px; background:rgba(255,255,255,.94); box-shadow:0 6px 16px rgba(0,0,0,.14); }
.pestanas .mas{ width:58px; height:58px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.9); color:#16171b; margin-left:6px; position:relative; z-index:1; }
.pestanas .mas svg{ width:28px; height:28px; }

/* cursor-mirada */
.miradaCapa{ pointer-events:none; }
.mirada{ position:absolute; left:0; top:0; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.55) 0, rgba(255,255,255,.28) 38%, rgba(255,255,255,0) 70%); mix-blend-mode:screen; }
.mirada::after{ content:''; position:absolute; inset:42px; border-radius:50%; background:rgba(255,255,255,.42); box-shadow:0 0 18px rgba(255,255,255,.8); }
.sombraSuelo{ border-radius:50%; background:rgba(40,22,8,.35); filter:blur(46px); }
</style>
</head><body>

<script>
// ---------------------------------------------------------------- parámetros: bloque params + ?clave=valor + formato por hash
const P = JSON.parse(document.getElementById('params').textContent);
for (const [c, v] of new URLSearchParams(location.search)) {
  if (c === 'ver') continue; const d = P[c];
  P[c] = typeof d === 'number' ? parseFloat(v) : (Array.isArray(d) || (d && typeof d === 'object')) ? (() => { try { return JSON.parse(v); } catch { return v.split(','); } })() : v;
}
const FMT = (location.hash.match(/(16x9|9x16)/) || [0, P.formato || '9x16'])[1];
const [W, H] = FMT === '16x9' ? [1920, 1080] : [1080, 1920], VERT = H > W;
if (P.tema === 'oscuro') document.documentElement.classList.add('oscuro');
const hexRgb = (h) => { const n = parseInt(h.replace('#', '').replace(/^(.)(.)(.)$/, '$1$1$2$2$3$3'), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
if (P.acento) { document.documentElement.style.setProperty('--acento', P.acento); document.documentElement.style.setProperty('--halo', hexRgb(P.acento)); }
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');

// ---------------------------------------------------------------- iconos (trazo, 24×24)
const I = (d, f = false) => `<svg viewBox="0 0 24 24" fill="${f ? 'currentColor' : 'none'}" stroke="${f ? 'none' : 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICO = {
  casa: I('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'), rayo: I('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),
  capas: I('<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>'), campana: I('<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>'),
  reloj: I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'), camara: I('<rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/>'),
  ajustes: I('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'),
  sol: I('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  luna: I('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'), mas: I('<path d="M12 5v14M5 12h14"/>'),
  arriba: I('<path d="M6 15l6-6 6 6"/>'), abajo: I('<path d="M6 9l6 6 6-6"/>'), check: I('<path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1" stroke-dasharray="1"/>'),
  play: I('<path d="M7 4.5v15l13-7.5z"/>', true), pausa: I('<rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/>', true),
  ant: I('<path d="M18 5v14L8 12z"/><rect x="5" y="5" width="2.6" height="14" rx="1"/>', true), sig: I('<path d="M6 5v14l10-7z"/><rect x="16.4" y="5" width="2.6" height="14" rx="1"/>', true),
  repetir: I('<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>'), aleatorio: I('<path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/>'),
  tv: I('<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/>'), nota: I('<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>'),
  airdrop: I('<circle cx="12" cy="12" r="1.6"/><path d="M8.5 15.5a5 5 0 1 1 7 0M5.6 18.4a9 9 0 1 1 12.8 0"/>'), mensaje: I('<path d="M12 4c5 0 9 3.1 9 7s-4 7-9 7c-1 0-2-.1-2.9-.4L5 19.5l1.2-3.6C4.2 14.6 3 12.9 3 11c0-3.9 4-7 9-7z"/>', true),
  correo: I('<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/>'), notas: I('<rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>'),
  mic: I('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
};

escena({ duracion: P.duracion, ancho: W, alto: H }, (MG) => {
  const { k, lerp, cl, curvas: C, DT, MB } = MG, D = P.duracion;
  // ================================================================ fondo: foto/vídeo del usuario o un salón cálido desenfocado
  const capaFondo = document.querySelector('.mg-fondo');
  const cap = MG.el(`<div class="cap"></div>`, capaFondo);
  let sala;
  if (P.fondo) {
    const esVideo = /\.(mp4|webm|mov|m4v)$/i.test(P.fondo);
    if (esVideo) { const c = MG.tarjeta(P.fondo, W * 1.1, H * 1.1, 0, { padre: cap }); c.style.cssText += ';left:-5%;top:-5%;border-radius:0;box-shadow:none'; c.querySelector('video').style.cssText = 'width:100%;height:100%;object-fit:cover'; sala = c; }
    else sala = MG.el(`<img class="fondo-media" src="${P.fondo}" alt="">`, cap);
    if (P.desenfoqueFondo) sala.style.filter = `blur(${P.desenfoqueFondo}px)`;
  } else {
    // salón dibujado con degradados y formas suaves (pared, ventana con luz, sofá, lámpara, planta, cuadro, alfombra) y desenfocado de verdad
    sala = MG.el(`<div class="sala" style="filter:blur(${VERT ? 16 : 14}px)">
      <div style="inset:0;background:linear-gradient(180deg,#d9c6ae 0%,#c9b197 46%,#a88d72 62%,#7d644f 100%)"></div>
      <div style="left:58%;top:4%;width:30%;height:56%;border-radius:10px;background:linear-gradient(180deg,#fff7e6,#ffe7c2 60%,#f4cf9a);box-shadow:0 0 160px 60px rgba(255,226,170,.55)"></div>

      el.style.background = `rgba(255,255,255,${(P.tema === 'oscuro' ? .10 : .30) + .16 * foco})`;
      el.style.boxShadow = `inset 0 1px 0 rgba(255,255,255,.5), 0 ${18 * foco}px ${40 * foco}px rgba(0,0,0,${.12 * foco})`;
      const br = el.querySelector('.brillo'); br.style.opacity = foco; br.style.setProperty('--mx', ((m0.x - r.x) / r.w * 100) + '%'); br.style.setProperty('--my', ((m0.y - r.y) / r.h * 100) + '%');
      const ta = p.tt;

      if (c.tipo === 'interruptor' || c.tipo === 'temperatura') {
        const sw = el.querySelector('.sw'), kn = sw.querySelector('i'), on = c.tipo === 'temperatura' ? 1 : C.rebote(k(t, ta, ta + .55));
        kn.style.transform = `translateX(${40 * on}px) scaleX(${1 + .25 * Math.sin(Math.PI * cl(k(t, ta, ta + .3)))})`;
        sw.style.background = `color-mix(in srgb, var(--acento) ${cl(on) * 100}%, var(--pista))`;
        const det = el.querySelector('.det'); if (det) det.textContent = t > ta + .15 ? (c.detalleOn || c.detalle) : c.detalle;
      }
      if (c.tipo === 'temperatura') {
        const d0 = c.desde ?? 22, d1 = c.hasta ?? 16, pasos = Math.abs(d0 - d1), paso = .24;
        const n = Math.min(pasos, Math.max(0, Math.floor((t - ta) / paso) + 1)), v = d0 + Math.sign(d1 - d0) * n;
        const num = el.querySelector('.num'); num.textContent = v;
        const fr = n > 0 && n <= pasos ? (t - ta - (n - 1) * paso) / paso : 1;   // cada cambio: el número baja con un pequeño rebote
        num.style.display = 'inline-block'; num.style.transform = `translateY(${(1 - C.rebote(cl(fr * 1.4))) * -26}px)`;
        const b = el.querySelector('.baja'); const pul = n > 0 && t < ta + pasos * paso + .1 ? Math.sin(Math.PI * cl(fr)) : 0;
        b.style.transform = `scale(${1 - .12 * pul})`; b.style.background = `color-mix(in srgb, var(--acento) ${pul * 70}%, var(--vid3))`; b.style.color = pul > .5 ? '#fff' : 'var(--texto)';
      }
      if (c.tipo === 'musica') {
        const cs = el._canciones, salto = ta, dur = 204, t0 = 12;
        const cambio = cs.length > 1 ? C.afterEffects75(k(t, salto + .1, salto + .55)) : 0;
        const pos = cambio > .5 ? (t - salto - .3) * 1 : t0 + (t - p.ent) * 1;     // segundos de la canción (avanza en tiempo real)
        const frac = cl(pos / dur) + (cambio > .5 ? 0 : .02 * C.suave(cl(t / D)));
        el.querySelector('.barraMus i').style.width = frac * 100 + '%'; el.querySelector('.barraMus b').style.left = frac * 100 + '%';
        const sec = Math.max(0, Math.floor(pos)), rest = dur - sec;
        el.querySelector('.ta').textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
        el.querySelector('.tb').textContent = `−${Math.floor(rest / 60)}:${String(rest % 60).padStart(2, '0')}`;
        const txts = [...el.querySelectorAll('.mus-txt > div')], ports = [...el.querySelectorAll('.portada > div')];
        txts.forEach((d, j) => { const y = (j - cambio) * 80; d.style.transform = `translateY(${y}px)`; d.style.opacity = 1 - Math.min(1, Math.abs(j - cambio)); MG.desenfoca(d, 0, Math.abs(j - cambio) < 1 ? Math.sin(Math.PI * cambio) * 4 : 0); });
        ports.forEach((d, j) => { d.style.opacity = j === 0 ? 1 : cambio; d.style.transform = `scale(${j === 0 ? 1 : lerp(1.2, 1, cambio)})`; });
        const nx = el.querySelector('.nx'); nx.style.display = 'inline-block'; nx.style.transform = `scale(${1 - .25 * Math.sin(Math.PI * cl((t - salto) / .3))})`;
        const pp = el.querySelector('.pp'); pp.style.display = 'inline-block'; pp.style.transform = `scale(${1 + .08 * Math.sin(t * 6) * cl((t - p.ent) / .5)})`;
      }
      if (c.tipo === 'lista') {
        const items = [...el.querySelectorAll('.item')], tot = items.length;
        items.forEach((it, j) => {
          const hecho = j === 0 ? C.salidaCubica(k(t, ta, ta + .35)) : 0, pop = j === 0 ? C.reboteFuerte(k(t, ta, ta + .6)) : 1;
          const cir = it.querySelector('.cir'); cir.style.background = `rgba(var(--halo),${hecho})`; cir.style.borderColor = hecho > .3 ? 'transparent' : 'var(--mute)';
          cir.style.transform = `scale(${j === 0 && t > ta ? lerp(.6, 1, pop) : 1})`; cir.style.color = '#fff';
          cir.querySelector('path').style.strokeDashoffset = 1 - C.salidaCubica(k(t, ta + .1, ta + .45)) * (j === 0 ? 1 : 0);
          const tx = it.querySelector('.tx'), tach = it.querySelector('.tachado');
          tach.style.width = (j === 0 ? C.afterEffects75(k(t, ta + .25, ta + .7)) * tx.offsetWidth : 0) + 'px'; tx.style.opacity = 1 - .45 * C.suave(k(t, ta + .25, ta + .7)) * (j === 0 ? 1 : 0);
        });
        const cu = el.querySelector('.cuenta'), cambia = t > ta + .3; cu.textContent = cambia ? tot - 1 : tot;
        cu.style.transform = `translateY(${cambia ? (1 - C.rebote(k(t, ta + .3, ta + .9))) * 30 : 0}px)`;
      }
      if (c.tipo === 'apps') {
        [...el.querySelectorAll('.app i')].forEach((ic, j) => {
          const a = MG.entra(ic, t, p.ent + .25 + j * .06, { d: .5, dy: 0, escala0: .2, curva: 'reboteFuerte', base: 2, desenfoque: false });
          const b = C.reboteFuerte(k(t, ta + j * .09, ta + .7 + j * .09)), salto = t > ta + j * .09 ? Math.sin(Math.PI * cl((t - ta - j * .09) / .38)) : 0;
          ic.style.transform = `translateY(${-30 * salto}px) scale(${a.s * (1 + .12 * salto)})`; ic.style.opacity = 1;
        });
      }
      if (c.tipo === 'cifra') {
        const dec = c.decimales ?? 0, v = (c.valor ?? 0) * C.salidaQuint(k(t, p.ent + .3, p.ent + 1.6));
        el.querySelector('.num').textContent = v.toLocaleString('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec });
        [...el.querySelectorAll('.barras i')].forEach((b, j, arr) => {
          const cre = C.rebote(k(t, p.ent + .3 + j * .06, p.ent + .9 + j * .06)), ola = Math.sin(Math.PI * cl((t - ta - j * .05) / .5)) * (t > ta ? 1 : 0);
          b.style.transform = `scaleY(${Math.max(.02, cre) * (1 + .18 * ola)})`; b.style.transformOrigin = '50% 100%';
          b.classList.toggle('on', j === arr.length - 2 || (t > ta && j === arr.length - 1));
        });
      }
    });

    // ---- pestañas: la píldora se desliza de la primera a la elegida (con muelle y un estirón en mitad del viaje)
    const jF = Math.min(P.pestanaFinal ?? 1, pestSpans.length - 1), pm = C.rebote(k(t, T.pestCambio, T.pestCambio + .7)), est = Math.sin(Math.PI * cl(k(t, T.pestCambio, T.pestCambio + .4)));
    const a0 = Lc.pestL[0], a1 = Lc.pestL[jF], pw = lerp(a0.w, a1.w, pm) + est * 40;
    pil.style.left = (lerp(a0.x, a1.x, pm) - est * 20) + 'px'; pil.style.width = pw + 'px';
    pestSpans.forEach((s, i) => s.style.color = (i === 0 && pm < .5) || (i === jF && pm >= .5) ? '#16171b' : 'var(--mute)');
  };
});
</script>
