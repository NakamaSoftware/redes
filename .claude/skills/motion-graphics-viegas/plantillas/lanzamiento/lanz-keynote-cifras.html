<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla de lanzamiento «lanz-keynote-cifras» · Viegas IA · Motion Lab
     Diapositiva de cifras de keynote: un chip/procesador con brillo entra con muelle y de sus bordes salen trazos de
     circuito que se dibujan (con pulsos de luz que los recorren); al lado, cifras gigantes con degradado que pasan de
     desenfocadas a nítidas mientras cuentan («2× más rápido», «40 % menos…»), y se desenfocan al salir para dar paso a la
     siguiente (transición de enfoque). El chip late con cada cifra. Al final, «zoom a través» del chip hasta el logo.
     Cambia "chip" (texto del chip), "chipSub", "cifras" (lista de {valor, decimales, prefijo, sufijo, texto}),
     "marca", "lema", "logo" (ruta o "" = inicial), colores "fondo", "tinta", "gris", "acento", "acento2" y "duracion".
     Formato por hash: #9x16 (Reels, por defecto: chip arriba, cifra debajo) · #16x9 (YouTube: chip a la izquierda). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=block">
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<style>
:root{ --fuente:'Inter Tight','Inter','Segoe UI',system-ui,sans-serif;
  --fondo:#030304; --tinta:#F5F5F7; --gris:#86868B; --acento:#D97757; --acento2:#F4C2A8; --halo:217,119,87; }
html,body{ background:var(--fondo); }
.mg-fondo{ background:radial-gradient(70% 50% at var(--hx,50%) var(--hy,35%), rgba(var(--halo),.10), var(--fondo) 70%); }
.mg-vista{ perspective:none; }
.mg-mundo > *{ position:absolute; left:0; top:0; }
.chip{ border-radius:44px; display:grid; place-items:center; text-align:center;
  background:linear-gradient(145deg,#2C2C31,#121214 55%,#222226);
  box-shadow:0 0 0 2px rgba(255,255,255,.10) inset, 0 0 0 10px #0B0B0D, 0 0 0 12px rgba(255,255,255,.08), 0 40px 120px rgba(0,0,0,.8); }
.chip .in{ position:absolute; inset:28px; border-radius:24px; border:2px solid rgba(var(--halo),.55);
  background:radial-gradient(circle at 50% 40%, rgba(var(--halo),.18), transparent 70%); }
.chip b{ position:relative; font:800 112px/1 var(--fuente); letter-spacing:-.05em;
  background:linear-gradient(160deg,#FFFFFF,var(--acento2) 45%,var(--acento)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.chip span{ position:relative; display:block; font:600 22px var(--fuente); letter-spacing:.32em; text-transform:uppercase; color:var(--gris); margin-top:10px; }
.brillo{ border-radius:50%; background:radial-gradient(closest-side, rgba(var(--halo),.55), rgba(var(--halo),.12) 50%, transparent); pointer-events:none; }
.punto{ width:12px; height:12px; border-radius:50%; background:var(--acento); box-shadow:0 0 14px rgba(var(--halo),.9); }
.pulso{ width:10px; height:10px; border-radius:50%; background:#fff; box-shadow:0 0 10px #fff, 0 0 26px rgba(var(--halo),1); }
.num{ font:800 var(--fn)/1 var(--fuente); letter-spacing:-.06em; white-space:nowrap; font-variant-numeric:tabular-nums;
  background:linear-gradient(170deg,#FFFFFF 15%,var(--acento2) 55%,var(--acento)); -webkit-background-clip:text; background-clip:text; color:transparent; padding:0 .05em .06em; }
.lab{ font:600 var(--fl) var(--fuente); letter-spacing:-.025em; color:var(--tinta); white-space:nowrap; text-align:center; }
.lab i{ font-style:normal; color:var(--gris); }
.logo{ width:150px; height:150px; border-radius:42px; display:grid; place-items:center; overflow:hidden; background:var(--acento); color:var(--fondo);
  font:700 86px var(--fuente); box-shadow:0 30px 90px rgba(var(--halo),.45), inset 0 1px 0 rgba(255,255,255,.35); }
.logo img{ width:100%; height:100%; object-fit:contain; }
.marca{ font:700 64px var(--fuente); letter-spacing:-.035em; color:var(--tinta); white-space:nowrap; }
.lema{ font:500 36px var(--fuente); color:var(--gris); white-space:nowrap; }
</style>
</head><body>
<script id="params" type="application/json">
{
  "formato": "9x16",
  "duracion": 10,
  "fondo": "#030304",
  "tinta": "#F5F5F7",
  "gris": "#86868B",
  "acento": "#D97757",
  "acento2": "#F4C2A8",
  "chip": "V1",
  "chipSub": "Tu motor",
  "cifras": [
    { "valor": 2, "decimales": 0, "prefijo": "", "sufijo": "×", "texto": "más rápido" },
    { "valor": 40, "decimales": 0, "prefijo": "", "sufijo": " %", "texto": "menos tiempo de edición" },
    { "valor": 18, "decimales": 0, "prefijo": "", "sufijo": " h", "texto": "de trabajo ahorradas" }
  ],
  "marca": "Tu Marca",
  "lema": "Más potencia. Menos esfuerzo.",
  "logo": ""
}
</script>
<script>
const P = JSON.parse(document.getElementById('params').textContent);
for (const [c, v] of new URLSearchParams(location.search)) {
  if (c === 'ver') continue; const d = P[c];
  P[c] = typeof d === 'number' ? parseFloat(v) : (d && typeof d === 'object') ? (() => { try { return JSON.parse(v); } catch { return v.split(','); } })() : v;
}
const FMT = (location.hash.match(/(16x9|9x16)/) || [0, P.formato || '9x16'])[1];
const [W, H] = FMT === '16x9' ? [1920, 1080] : [1080, 1920], VERT = H > W;
const raiz = document.documentElement.style;
const hexRgb = (h) => { const n = parseInt(h.replace('#', '').replace(/^(.)(.)(.)$/, '$1$1$2$2$3$3'), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
for (const c of ['fondo', 'tinta', 'gris', 'acento', 'acento2']) if (P[c]) raiz.setProperty('--' + c, P[c]);
if (P.acento) raiz.setProperty('--halo', hexRgb(P.acento));
if (P.fuente) raiz.setProperty('--fuente', `'${P.fuente}','Inter Tight',system-ui,sans-serif`);
raiz.setProperty('--fn', (VERT ? 290 : 300) + 'px'); raiz.setProperty('--fl', (VERT ? 52 : 56) + 'px');
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const logoHTML = () => P.logo ? `<div class="logo"><img src="${P.logo}" alt=""></div>` : `<div class="logo">${esc((P.marca || '·').trim()[0].toUpperCase())}</div>`;

escena({ duracion: P.duracion, ancho: W, alto: H }, (MG) => {
  const { k, lerp, curvas: C } = MG, D = P.duracion;
  const CS = VERT ? 300 : 320, [CX, CY] = VERT ? [W / 2, 640] : [540, 540];
  const NX = VERT ? W / 2 : 1330, NY = VERT ? 1110 : 470;
  // trazos de circuito: salen de los 4 lados, giran 45° y terminan en un punto (deterministas)
  const trazos = [], rnd = (i) => { const x = Math.sin(i * 91.7 + 3.1) * 43758.5; return x - Math.floor(x); };
  const brillo = MG.el(`<div class="brillo"></div>`);
  for (let lado = 0; lado < 4; lado++) for (let j = 0; j < 4; j++) {
    const n = lado * 4 + j, off = (j - 1.5) * CS * .2, h = CS / 2 + 12;
    const haciaNum = VERT ? lado === 2 : lado === 1;   // el lado que mira a la cifra lleva trazos cortos (nada se cruza)
    const L1 = haciaNum ? 26 : 40 + rnd(n) * 60, L2 = haciaNum ? 20 + rnd(n + 7) * 30 : (VERT && lado % 2 ? 110 : 170) + rnd(n + 7) * (VERT ? 120 : 200), sg = j < 2 ? -1 : 1, dg = 40 + rnd(n + 3) * 40;
    const rot = ([ax, ay]) => lado === 0 ? [CX + ax, CY - ay] : lado === 1 ? [CX + ay, CY + ax] : lado === 2 ? [CX + ax, CY + ay] : [CX - ay, CY + ax];
    const pts = [[off, h], [off, h + L1], [off + sg * dg, h + L1 + dg], [off + sg * dg, h + L1 + dg + L2]].map(rot);
    const d = 'M' + pts.map((p) => p.map((v) => v.toFixed(1)).join(' ')).join(' L');
    const ln = MG.linea(d, `rgba(${hexRgb(P.acento || '#D97757')},.55)`, 3);
    trazos.push({ ln, fin: pts[3], punto: MG.el(`<div class="punto"></div>`), pulso: MG.el(`<div class="pulso"></div>`), t0: .55 + rnd(n + 11) * .7, L: ln.getTotalLength() });
  }
  const chip = MG.el(`<div class="chip"><div class="in"></div><div><b>${esc(P.chip)}</b><span>${esc(P.chipSub)}</span></div></div>`);
  chip.style.width = chip.style.height = CS + 'px';
  const cif = P.cifras.map((c) => ({ c, num: MG.el(`<div class="num"></div>`), lab: MG.el(`<div class="lab">${esc(c.texto)}</div>`) }));
  const logo = MG.el(logoHTML()), marca = MG.el(`<div class="marca">${esc(P.marca)}</div>`), lema = MG.el(`<div class="lema">${esc(P.lema)}</div>`);

  const tZ = D - 2.6, tC = tZ + .62, N = cif.length, S = (tZ - 1.1) / N, tIn = (i) => 1.1 + i * S;
  const foco = (el, t, t0, d, blur, s0, curva) => { const f = C[curva](k(t, t0, t0 + d)); return { f, b: (1 - f) * blur, s: lerp(s0, 1, f) }; };

  return (t) => {
    const zt = C.entradaCubica(k(t, tZ, tC)), zc = C.salidaQuint(k(t, tC - .05, tC + 1.4));
    const z = t < tC ? lerp(1.04, 1.12, k(t, 0, tZ)) * (1 + 12 * zt) : lerp(1.3, 1, zc) * lerp(1, 1.05, k(t, tC, D));
    const ox = t < tC ? lerp(VERT ? W / 2 : 960, CX, C.entradaSalidaQuint(k(t, tZ - .7, tZ + .1))) : W / 2;
    const oy = t < tC ? lerp(VERT ? 880 : 540, CY, C.entradaSalidaQuint(k(t, tZ - .7, tZ + .1))) : H / 2;
    MG.vista.style.transformOrigin = `${ox}px ${oy}px`;
    MG.vista.style.transform = `scale(${z}) translate(${Math.sin(t * .4) * 8}px, ${Math.cos(t * .3) * 6}px) rotate(${Math.sin(t * .25) * .4}deg)`;
    raiz.setProperty('--hx', (CX / W * 100 + Math.sin(t * .5) * 6) + '%'); raiz.setProperty('--hy', (CY / H * 100) + '%');
    const vis = t < tC ? 1 : 0;

    // chip: entra con muelle desde pequeño; late en cada cifra
    const ec = MG.entra(chip, t, .15, { d: .8, dy: 0, escala0: .55, curva: 'reboteFuerte', base: 12 });
    let late = 0; for (let i = 0; i < N; i++) { const u = t - tIn(i); if (u > 0) late += Math.exp(-u * 4) * (1 - Math.exp(-u * 30)); }
    MG.pon(chip, CX - CS / 2, CY - CS / 2 + ec.y, ec.s * (1 + .03 * late), `rotate(${(1 - C.salidaQuint(k(t, .15, 1.2))) * -12}deg)`);
    chip.style.opacity = Math.min(1, ec.p * 1.8) * vis;
    const BS = CS * 2.6; brillo.style.width = brillo.style.height = BS + 'px';
    MG.pon(brillo, CX - BS / 2, CY - BS / 2, .8 + .25 * late + .05 * Math.sin(t * 2));
    brillo.style.opacity = C.salidaCubica(k(t, .4, 1.4)) * (.55 + .45 * Math.min(1, late)) * vis;

    // circuito: cada trazo se dibuja con su curva; un pulso de luz lo recorre en bucle
    trazos.forEach((tr, n) => {
      const p = (n % 2 ? C.salidaExpo : C.salidaCubica)(k(t, tr.t0, tr.t0 + .7));
      tr.ln.dibuja(p); tr.ln.style.opacity = vis * (p > 0 ? 1 : 0);
      const pe = C.rebote(k(t, tr.t0 + .55, tr.t0 + 1.1));
      MG.pon(tr.punto, tr.fin[0] - 6, tr.fin[1] - 6, pe); tr.punto.style.opacity = Math.min(1, pe * 2) * vis;
      const ciclo = 1.6 + (n % 5) * .25, u = ((t - tr.t0 - .8 + n * .37) % ciclo + ciclo) % ciclo / ciclo;
      const q = tr.ln.getPointAtLength(tr.L * (1 - C.entradaSalidaQuint(u)));
      MG.pon(tr.pulso, q.x - 5, q.y - 5, 1); tr.pulso.style.opacity = (t > tr.t0 + .8 ? Math.sin(Math.PI * u) : 0) * vis;
    });

    // cifras con transición de enfoque
    cif.forEach((o, i) => {
      const t0 = tIn(i), t1 = i === N - 1 ? tZ + .1 : t0 + S - .4;
      const en = foco(o.num, t, t0, .85, 34, 1.18, i % 2 ? 'salidaExpo' : 'salidaQuint');
      const sa = C.entradaCubica(k(t, t1, t1 + .45));
      MG.contador(o.num, t, t0 + .05, t0 + 1.2, 0, o.c.valor, { decimales: o.c.decimales || 0, prefijo: o.c.prefijo || '', sufijo: o.c.sufijo || '' });
      const s = en.s * lerp(1, .86, sa), b = en.b + sa * 30;
      o.num.style.opacity = (Math.min(1, en.f * 1.6) * (1 - sa)) * vis;
      o.num.style.filter = b > .2 ? `blur(${b.toFixed(2)}px)` : 'none';
      MG.pon(o.num, NX - o.num.offsetWidth / 2, NY - o.num.offsetHeight / 2 + (1 - en.f) * 40 - sa * 30, s);
      const el = foco(o.lab, t, t0 + .3, .7, 16, 1, 'salidaCubica');
      o.lab.style.opacity = (Math.min(1, el.f * 1.6) * (1 - sa)) * vis;
      o.lab.style.filter = el.b + sa * 20 > .2 ? `blur(${(el.b + sa * 20).toFixed(2)}px)` : 'none';
      MG.pon(o.lab, NX - o.lab.offsetWidth / 2, NY + (VERT ? 180 : 190) + (1 - el.f) * 30 - sa * 20);
    });

    // cierre
    const bloque = 150 + 50 + 80 + 20 + 50, y0 = (H - bloque) / 2 - (VERT ? 40 : 0);
    const el = MG.entra(logo, t, tC, { d: .7, dy: 0, escala0: .25, curva: 'reboteFuerte', base: 10 });
    MG.pon(logo, (W - 150) / 2, y0 + el.y, el.s);
    const ma = MG.entra(marca, t, tC + .3, { d: .6, dy: 60, escala0: 1, curva: 'salidaExpo', base: 6 });
    MG.pon(marca, (W - marca.offsetWidth) / 2, y0 + 200 + ma.y);
    const le = MG.entra(lema, t, tC + .5, { d: .6, dy: 30, escala0: 1, curva: 'salidaCubica', base: 5 });
    MG.pon(lema, (W - lema.offsetWidth) / 2, y0 + 290 + le.y);
  };
});
</script>
</body></html>
