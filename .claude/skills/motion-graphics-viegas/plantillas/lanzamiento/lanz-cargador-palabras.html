<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla de lanzamiento «lanz-cargador-palabras» · Viegas IA · Motion Lab
     Teaser minimalista (lenguaje de los «loaders» de UI en X): fondo blanco puro (o negro), un cargador de 8 segmentos redondeados que
     giran y se estiran con ritmo orgánico y, a su lado, un texto grande en sans negrita que cambia de frase con un «morph»:
     las letras salen hacia arriba con desenfoque, las nuevas entran desde abajo, el ancho del bloque se reajusta con muelle suave
     y el cargador se desplaza para que todo quede centrado. Al final el cargador se convierte en el logo y aparecen
     «Próximamente · Coming soon» y «Síguenos en X».
     Cambia "frases" (lista), "producto" (la última frase), "logo" (ruta a PNG/SVG o "" = inicial), "tema" ("claro" | "oscuro"),
     "acento", "fuente" (familia de Google Fonts), "proximamente", "cta" y "red" ("X" dibuja el logo de X; otro texto, tal cual).
     Formato por hash: #9x16 (Reels, por defecto) · #16x9 (YouTube). También ?producto=Hola&tema=oscuro en la dirección. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=block">
<link rel="stylesheet" href="../motor/estilo.css">
<script src="../motor/motor.js"></script>
<style>
:root{
  --fuente:'Inter Tight','SF Pro Display','Inter','Segoe UI',system-ui,sans-serif;
  --fondo:#FFFFFF; --texto:#0A0A0B; --mute:#8B9099; --seg:10,10,11; --linea:rgba(10,10,11,.08); --tarjeta:#FFFFFF; --sombra:20,22,30;
  --acento:#4F46E5; --halo:79,70,229;
}
.oscuro{ --fondo:#000000; --texto:#F4F4F5; --mute:#7D828C; --seg:244,244,245; --linea:rgba(255,255,255,.10); --tarjeta:#0E0E10; --sombra:0,0,0; }
html,body{ background:var(--fondo); }
.mg-fondo{ background:var(--fondo); }
.fx-luz{ position:absolute; border-radius:50%; filter:blur(140px); pointer-events:none; }   /* desenfoque gaussiano amplio */
.mg-mundo > *{ position:absolute; left:0; top:0; }
.frase{ font-family:var(--fuente); font-weight:700; letter-spacing:-.035em; color:var(--texto); white-space:pre; line-height:1.1;
  font-feature-settings:"kern" 1, "ss01" 1, "cv11" 1; font-kerning:normal; }
.frase span{ display:inline-block; white-space:pre; will-change:transform, filter, opacity; }
.medida{ visibility:hidden; }
.cargador{ overflow:visible; }
.logo{ display:grid; place-items:center; overflow:hidden; color:#fff; font-family:var(--fuente); font-weight:800; letter-spacing:-.04em;
  background:linear-gradient(155deg, color-mix(in srgb, var(--acento) 72%, #fff), var(--acento));
  box-shadow:0 24px 60px rgba(var(--halo),.30), 0 0 0 1px var(--linea); }
.logo img{ width:100%; height:100%; object-fit:contain; }
.proximo{ font-family:var(--fuente); font-weight:500; letter-spacing:-.01em; color:var(--mute); white-space:nowrap; }
.proximo b{ font-weight:500; color:var(--texto); }
.proximo i{ display:inline-block; width:.22em; height:.22em; border-radius:50%; background:var(--acento); margin:0 .5em; vertical-align:.2em; }
.pastilla{ display:inline-flex; align-items:center; gap:.5em; padding:.62em 1.1em .62em 1.15em; border-radius:99px; white-space:nowrap;
  font-family:var(--fuente); font-weight:600; letter-spacing:-.01em; color:var(--fondo); background:var(--texto);
  box-shadow:0 18px 44px rgba(var(--sombra),.16); }
.pastilla svg{ width:.9em; height:.9em; fill:currentColor; }
</style>
</head><body>
<script id="params" type="application/json">
{
  "formato": "9x16",
  "duracion": 10,
  "tema": "claro",
  "acento": "#4F46E5",
  "fuente": "Inter Tight",
  "frases": ["Waiting for you", "Thinking", "Almost there"],
  "producto": "Viegas IA",
  "logo": "",
  "proximamente": "Próximamente · Coming soon",
  "cta": "Síguenos en",
  "red": "X"
}
</script>
<script>
// ---------------------------------------------------------------- parámetros: bloque params + ?clave=valor + formato por hash
const P = JSON.parse(document.getElementById('params').textContent);
for (const [c, v] of new URLSearchParams(location.search)) {
  if (c === 'ver') continue; const d = P[c];
  P[c] = typeof d === 'number' ? parseFloat(v) : Array.isArray(d) ? (() => { try { return JSON.parse(v); } catch { return v.split(','); } })() : v;
}
const FMT = (location.hash.match(/(16x9|9x16)/) || [0, P.formato || '9x16'])[1];
const [W, H] = FMT === '16x9' ? [1920, 1080] : [1080, 1920], VERT = H > W;
if (P.tema === 'oscuro') document.documentElement.classList.add('oscuro');
const hexRgb = (h) => { const n = parseInt(h.replace('#', '').replace(/^(.)(.)(.)$/, '$1$1$2$2$3$3'), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
if (P.acento) { document.documentElement.style.setProperty('--acento', P.acento); document.documentElement.style.setProperty('--halo', hexRgb(P.acento)); }
// otra fuente de Google Fonts: se carga y la escena espera a tenerla antes de medir
if (P.fuente && P.fuente !== 'Inter Tight') {
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(P.fuente).replace(/%20/g, '+')}:wght@500;600;700;800&display=block`;
  document.head.appendChild(l);
  document.documentElement.style.setProperty('--fuente', `'${P.fuente}','Inter Tight','Segoe UI',system-ui,sans-serif`);
}
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const LOGO_X = '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';

escena({ duracion: P.duracion, ancho: W, alto: H }, (MG) => {
  const { k, lerp, curvas: C, DT, MB } = MG, D = P.duracion;
  if (P.fuente && P.fuente !== 'Inter Tight') MG._listos = [document.fonts.load(`700 100px "${P.fuente}"`).catch(() => {}), document.fonts.load(`500 40px "${P.fuente}"`).catch(() => {})];

  // ---- fondo: puro; una luz de acento muy suave que solo despierta con el logo
  const capa = document.querySelector('.mg-fondo');
  const luz = document.createElement('div'); luz.className = 'fx-luz'; capa.appendChild(luz);

  // ---- frases: cada una es un bloque de letras sueltas (para el morph letra a letra)
  const lista = [...(P.frases || []), P.producto].filter((s) => s != null && String(s).length);
  const frases = lista.map((s) => MG.el(`<div class="frase">${[...String(s)].map((c) => `<span>${esc(c)}</span>`).join('')}</div>`));
  frases.forEach((f) => { f.letras = [...f.children]; });

  // ---- cargador: 8 segmentos redondeados (trazos SVG) + logo que lo sustituye
  const NS = 'http://www.w3.org/2000/svg';
  const carg = MG.el(`<svg class="cargador" viewBox="-60 -60 120 120"></svg>`);
  const segs = Array.from({ length: 8 }, () => { const l = document.createElementNS(NS, 'line'); l.setAttribute('stroke-linecap', 'round'); l.style.stroke = 'rgb(var(--seg))'; carg.appendChild(l); return l; });
  const ini = (P.producto || '·').trim()[0].toUpperCase();
  const logo = MG.el(`<div class="logo">${P.logo ? `<img src="${P.logo}" alt="">` : ini}</div>`);

  // ---- cierre
  const prox = MG.el(`<div class="proximo">${esc(P.proximamente).replace(/\s*·\s*/, '<i></i>')}</div>`);
  const pill = MG.el(`<div class="pastilla">${esc(P.cta)} ${P.red === 'X' ? LOGO_X : `<b>${esc(P.red)}</b>`}</div>`);

  // ---- tiempos (s): cada frase dura «paso»; la última (producto) se queda; luego logo y cierre
  const n = frases.length, paso = Math.min(1.75, (D * .53) / Math.max(1, n - 1));
  const S0 = frases.map((_, j) => .35 + j * paso);            // inicio de cada frase
  const T = { logo: S0[n - 1] + 1.35, prox: S0[n - 1] + 1.85, pill: S0[n - 1] + 2.1 };

  let L = null;
  return (t) => {
    if (!L) {   // maqueta (una vez, con las fuentes ya cargadas): tamaño de letra que cabe, anchos de cada frase
      const base = VERT ? 150 : 150, margen = VERT ? 80 : 240;
      frases.forEach((f) => { f.style.fontSize = base + 'px'; });
      const anchos0 = frases.map((f) => f.offsetWidth), maxW = Math.max(...anchos0);
      const ratio = (S) => S * .82 + S * .3;                      // cargador + hueco, proporcionales a la letra
      let fs = base; const disp = W - 2 * margen;
      if (maxW + ratio(base) > disp) fs = base * disp / (maxW + ratio(base));
      frases.forEach((f) => { f.style.fontSize = fs + 'px'; });
      const anchos = frases.map((f) => f.offsetWidth), alto = frases[0].offsetHeight;
      const S = fs * .82, gap = fs * .3;
      carg.setAttribute('width', S); carg.setAttribute('height', S); carg.style.width = S + 'px'; carg.style.height = S + 'px';
      logo.style.width = logo.style.height = S + 'px'; logo.style.borderRadius = S * .27 + 'px'; logo.style.fontSize = S * .56 + 'px';
      prox.style.fontSize = fs * (VERT ? .34 : .3) + 'px'; pill.style.fontSize = fs * (VERT ? .3 : .26) + 'px';
      const yc = H * (VERT ? .47 : .48);
      L = { fs, anchos, alto, S, gap, yc, r: fs * .1 };
      luz.style.cssText = `width:${W * .9}px;height:${W * .9}px;left:${W * .05}px;top:${yc - W * .45}px;background:rgba(var(--halo),.07)`;
    }
    const { fs, anchos, alto, S, gap } = L;

    // ---- ancho animado del texto: muelle suave entre el ancho de una frase y la siguiente
    let w = anchos[0];
    for (let j = 1; j < n; j++) w += (anchos[j] - anchos[j - 1]) * C.reboteSuave(k(t, S0[j] + .04, S0[j] + 1.1));
    // ---- al final la fila sube para dejar sitio al cierre
    const sube = C.afterEffects75(k(t, T.logo + .15, T.logo + 1.05)) * fs * (VERT ? .62 : .5);
    const yRow = L.yc - sube;
    const x0 = (W - (S + gap + w)) / 2, xt = x0 + S + gap;

    // ---- cámara que nunca se para: zoom lento + deriva + empujón leve en cada cambio de frase
    let kick = 0; for (let j = 1; j < n; j++) kick += Math.sin(Math.PI * C.salidaCubica(k(t, S0[j] - .15, S0[j] + .75)));
    const z = lerp(1, 1.07, C.suave(t / D)) + kick * .012 + C.salidaQuint(k(t, T.logo, T.logo + 1.4)) * .02;
    MG.vista.style.transformOrigin = `${W / 2 + Math.sin(t * .3) * 30}px ${yRow}px`;
    MG.vista.style.transform = `scale(${z}) translate(${Math.sin(t * .37) * 7}px, ${Math.cos(t * .29) * 9 - sube * .15}px) rotate(${Math.sin(t * .23) * .25}deg)`;

    // ---- frases: salida hacia arriba con desenfoque (curva que acelera) · entrada desde abajo (llega rápido y se posa)
    frases.forEach((f, j) => {
      MG.pon(f, xt, yRow - alto / 2);
      const tIn = S0[j] + (j ? .2 : 0), tOut = j < n - 1 ? S0[j + 1] - .16 : 1e9;
      const visible = t > tIn - .05 && t < tOut + .9; f.style.visibility = visible ? 'visible' : 'hidden';
      if (!visible) return;
      const m = f.letras.length;
      f.letras.forEach((s, i) => {
        let y = 0, op = 1, bl = 0, sc = 1;
        if (t < tOut) {
          const a = tIn + i * .028, d = .62, cv = C.salidaQuint, p = cv(k(t, a, a + d)), q = cv(k(t - DT, a, a + d));
          const dy = fs * .62; y = (1 - p) * dy; op = Math.min(1, p * 1.6); sc = lerp(.96, 1, p);
          bl = Math.abs(dy * (p - q) / DT) * MB + (1 - p) * 6;
        } else {
          const a = tOut + i * .014, d = .3, cv = C.entradaCubica, p = cv(k(t, a, a + d)), q = cv(k(t - DT, a, a + d));
          const dy = -fs * .55; y = p * dy; op = 1 - p; sc = lerp(1, .97, p);
          bl = Math.abs(dy * (p - q) / DT) * MB + p * 7;
        }
        s.style.transform = `translateY(${y.toFixed(2)}px) scale(${sc.toFixed(4)})`; s.style.opacity = op.toFixed(3);
        MG.desenfoca(s, bl * .25, bl);
      });
    });

    // ---- cargador: 8 segmentos con ola de longitud y de opacidad; giro con velocidad variable + empujón en cada cambio
    let giro = t * 150 + Math.sin(t * 1.7) * 22;
    for (let j = 1; j < n; j++) giro += 135 * C.afterEffects75(k(t, S0[j] - .2, S0[j] + .7));
    giro += 260 * C.entradaCubica(k(t, T.logo - .1, T.logo + .45));
    let pulso = 1; for (let j = 1; j < n; j++) pulso -= .12 * Math.sin(Math.PI * k(t, S0[j] - .12, S0[j] + .32));
    const colapso = C.entradaCubica(k(t, T.logo, T.logo + .42));             // los segmentos se recogen hacia el centro
    const ent = MG.entra(carg, t, .12, { d: .7, dy: 0, escala0: .55, curva: 'salidaQuint', base: 6 });
    segs.forEach((l, i) => {
      const fase = t * 5.2 - i * (Math.PI / 4), ola = Math.pow(.5 + .5 * Math.sin(fase), 2);
      const rIn = (22 - ola * 6) * (1 - colapso), rOut = (rIn + 9 + ola * 17) * (1 - colapso * .9);
      const a = (i * 45 + giro) * Math.PI / 180;
      l.setAttribute('x1', (Math.cos(a) * rIn).toFixed(2)); l.setAttribute('y1', (Math.sin(a) * rIn).toFixed(2));
      l.setAttribute('x2', (Math.cos(a) * rOut).toFixed(2)); l.setAttribute('y2', (Math.sin(a) * rOut).toFixed(2));
      l.setAttribute('stroke-width', (13 + ola * 3).toFixed(2));
      l.style.strokeOpacity = (.18 + .82 * ola).toFixed(3);
    });
    MG.pon(carg, x0, yRow - S / 2, ent.s * pulso * (1 - colapso * .5));
    carg.style.opacity = Math.min(ent.p * 1.8, 1) * (1 - C.salidaCubica(k(t, T.logo + .25, T.logo + .5)));

    // ---- logo: aparece donde estaba el cargador, gira y se asienta con rebote
    const lg = MG.entra(logo, t, T.logo + .26, { d: .6, dy: 0, escala0: .35, curva: 'reboteFuerte', base: 8 });
    MG.pon(logo, x0, yRow - S / 2, lg.s, `rotate(${(-70 * (1 - C.salidaQuint(k(t, T.logo + .26, T.logo + 1.1)))).toFixed(2)}deg)`);
    luz.style.opacity = C.suave(k(t, T.logo, T.logo + 1.6));
    luz.style.transform = `translate(${Math.sin(t * .4) * 60}px, ${Math.cos(t * .33) * 40}px)`;

    // ---- cierre: «Próximamente · Coming soon» y la pastilla «Síguenos en X»
    const yP = yRow + alto / 2 + fs * (VERT ? .55 : .42);
    const e1 = MG.entra(prox, t, T.prox, { d: .7, dy: 60, escala0: .97, curva: 'salidaQuint', base: 6 });
    MG.pon(prox, (W - prox.offsetWidth) / 2, yP + e1.y, e1.s);
    const e2 = MG.entra(pill, t, T.pill, { d: .6, dy: 80, escala0: .85, curva: 'rebote', base: 6 });
    MG.pon(pill, (W - pill.offsetWidth) / 2, yP + prox.offsetHeight + fs * (VERT ? .42 : .32) + e2.y, e2.s);
  };
});
</script>
</body></html>
