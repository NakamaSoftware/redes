<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla por nicho «edu-lanzamiento» · Educación / infoproducto · Viegas IA · Motion Lab
     Lanzamiento con cuenta atrás: «Abrimos inscripciones» entra por letras, el nombre del curso por palabras, y el contador de
     días · horas · minutos · segundos corre de verdad (el dígito que cambia cae con rebote). Debajo, la fecha y el botón de lista de espera.
     Cambia "kicker", "curso", "dias", "horas", "minutos", "segundos", "fecha", "boton", "marca". Formato: #9x16 · #4x5 · #1x1 · Paleta: "noche" | "claro". -->
<link rel="stylesheet" href="../motor/estilo.css">
<link rel="stylesheet" href="../motor/temas/noche-azul.css">
<link rel="stylesheet" href="_nichos/nichos.css">
<script src="../motor/motor.js"></script>
<style>
.kick{ font:500 34px var(--mono); letter-spacing:.3em; text-transform:uppercase; color:var(--brillo, var(--acento)); text-align:center; }
.cuenta{ display:flex; gap:16px; justify-content:center; }
.cj{ width:200px; padding:24px 0 18px; text-align:center; }
.cj .d{ height:120px; overflow:hidden; position:relative; font:600 110px/120px var(--fuente); letter-spacing:-.04em; color:var(--texto); font-variant-numeric:tabular-nums; }
.cj .d span{ position:absolute; left:0; right:0; }
.cj small{ display:block; font:500 22px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin-top:6px; }
.fecha{ font:500 40px var(--fuente); color:var(--texto); text-align:center; }
.fecha b{ color:var(--brillo, var(--acento)); font-weight:600; }
</style>
</head><body>
<script id="params" type="application/json">
{
  "formato": "9x16",
  "duracion": 9,
  "paleta": "noche",
  "acento": "",
  "kicker": "Abrimos inscripciones",
  "curso": "Marca personal *con IA*",
  "dias": 3,
  "horas": 14,
  "minutos": 26,
  "segundos": 9,
  "fecha": "Lunes 3 de noviembre · <b>19:00 h</b>",
  "boton": "Únete a la lista de espera",
  "marca": "Academia Norte",
  "logo": ""
}
</script>
<script src="../motor/estilos.js"></script>
<script src="_nichos/nichos.js"></script>
<script>
const { P, W, H, VERT } = EST;
escena({ duracion: P.duracion, ancho: W, alto: H, fondo: 'marca', degradado: { tipo: 'aurora', fuerza: .22, ciclo: 18 } }, (MG) => {
  const N = NICHOS(MG), { k, C } = N, fin = P.duracion - 1.1, cw = W - (VERT ? 120 : 220);
  const kick = MG.texto(P.kicker, 'kick', 'letras'); kick.style.width = W + 'px';
  const curso = N.frase(P.curso, 'n-tit', cw); curso.style.fontSize = (VERT ? 128 : 100) + 'px';
  const et = ['días', 'horas', 'min', 'seg'];
  const cuenta = MG.el(`<div class="cuenta" style="width:${W}px">${et.map((e) => `<div class="n-card cj"><div class="d"><span></span><span></span></div><small>${e}</small></div>`).join('')}</div>`);
  const cajas = [...cuenta.children];
  const fecha = MG.el(`<div class="fecha" style="width:${W}px">${P.fecha}</div>`);
  const boton = MG.el(`<div class="n-btn">${P.boton}</div>`);
  const marca = MG.el(N.marca(.8));
  const total = ((P.dias * 24 + P.horas) * 60 + P.minutos) * 60 + P.segundos, dos = (n) => String(n).padStart(2, '0');
  const val = (s) => [Math.floor(s / 86400), Math.floor(s / 3600) % 24, Math.floor(s / 60) % 60, s % 60];
  let L;
  return (t) => {
    if (!L) { const tot = 80 + curso.offsetHeight + 70 + 200 + 60 + 60 + 50 + boton.offsetHeight; L = { y: (H - tot) / 2 }; }
    N.vivo(t, 1, 1.08);
    MG.pon(kick, 0, L.y);
    if (t < fin) MG.animaTexto(kick, t, .1, { paso: .03, dy: 40 }); else N.es(kick, t, 0, fin, { y: L.y, oy: -80 });
    const yC = L.y + 80; MG.pon(curso, (W - cw) / 2, yC);
    if (t < fin + .05) MG.animaTexto(curso, t, .6, { paso: .1, dy: 90 }); else N.es(curso, t, 0, fin + .05, { x: (W - cw) / 2, y: yC, oy: -110 });
    const yK = yC + curso.offsetHeight + 70;
    const s = Math.max(0, total - Math.floor(Math.max(0, t - 1.8))), a = val(s), b = val(Math.min(total, s + 1)), fr = Math.max(0, t - 1.8) % 1;
    cajas.forEach((c, i) => {
      const [n1, n0] = c.querySelectorAll('.d span'); n1.textContent = dos(a[i]); n0.textContent = dos(b[i]);
      const p = a[i] !== b[i] && t > 1.8 ? C.rebote(Math.min(1, fr * 2.2)) : 1; n1.style.transform = `translateY(${(p - 1) * 120}px)`; n0.style.transform = `translateY(${p * 120}px)`; n0.style.opacity = 1 - p;
      const e = MG.entra(c, t, 1.3 + i * .1, { dy: 140, curva: ['rebote', 'reboteFuerte', 'rebote', 'reboteSuave'][i], d: .6 }); c.style.transform = `translateY(${e.y}px) scale(${e.s})`;
    });
    N.es(cuenta, t, 0, fin + .12, { y: yK, dy: 0, oy: -90 }); if (t < fin + .12) cuenta.style.opacity = 1;
    N.es(fecha, t, 2.0, fin + .2, { y: yK + 250, dy: 60, curva: 'salidaQuint', oy: -70 });
    N.es(boton, t, 2.4, fin + .28, { x: N.cx(boton), y: yK + 340, dy: 100, curva: 'reboteFuerte', oy: -60 });
    if (t > 3.2 && t < fin) boton.style.scale = 1 + .03 * Math.sin((t - 3.2) * 4.5);
    N.es(marca, t, 2.8, fin + .35, { x: N.cx(marca), y: H - (VERT ? 200 : 70), dy: 50, oy: -40 });
  };
});
</script>
</body></html>
