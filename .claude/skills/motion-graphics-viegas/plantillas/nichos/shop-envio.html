<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla por nicho «shop-envio» · E-commerce / tienda · Viegas IA · Motion Lab
     «Envío gratis» con cuenta atrás: la furgoneta entra a toda velocidad con desenfoque de movimiento y frena con rebote, las
     líneas de velocidad se recogen, el titular entra por palabras y el reloj HH:MM:SS cuenta atrás de verdad (cada dígito cae al cambiar).
     Cambia "titulo", "condicion", "horas", "minutos", "segundos", "codigo", "marca". Formato: #9x16 · #4x5 · #1x1 · Paleta: "noche" | "claro". -->
<link rel="stylesheet" href="../motor/estilo.css">
<link rel="stylesheet" href="../motor/temas/noche-azul.css">
<link rel="stylesheet" href="_nichos/nichos.css">
<script src="../motor/motor.js"></script>
<style>
.furgo svg{ width:520px; height:300px; overflow:visible; }
.vel{ height:8px; border-radius:8px; background:linear-gradient(90deg, transparent, rgba(var(--claro),.5)); }
.cond{ font:500 40px/1.3 var(--fuente); color:var(--mute); text-align:center; }
.reloj{ display:flex; gap:18px; justify-content:center; align-items:flex-start; }
.caja{ width:200px; padding:26px 0 20px; text-align:center; }
.caja .d{ height:130px; overflow:hidden; font:600 120px/130px var(--fuente); letter-spacing:-.04em; color:var(--texto); font-variant-numeric:tabular-nums; position:relative; }
.caja .d span{ position:absolute; left:0; right:0; }
.caja small{ display:block; font:500 22px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin-top:6px; }
.dos{ font:600 100px/1 var(--fuente); color:var(--mute); padding-top:40px; }
.cod{ display:inline-flex; align-items:center; gap:16px; font:500 34px var(--fuente); color:var(--texto); padding:20px 32px; border-radius:22px; border:2px dashed rgba(var(--claro),.35); }
.cod b{ font:600 38px var(--mono); color:var(--brillo, var(--acento)); letter-spacing:.08em; }
</style>
</head><body>
<script id="params" type="application/json">
{
  "formato": "9x16",
  "duracion": 8,
  "paleta": "noche",
  "acento": "",
  "titulo": "Envío *gratis* solo hoy",
  "condicion": "En todos los pedidos, sin importe mínimo",
  "horas": 5,
  "minutos": 42,
  "segundos": 18,
  "codigo": "ENVIOGRATIS",
  "marca": "Sonora Store",
  "logo": ""
}
</script>
<script src="../motor/estilos.js"></script>
<script src="_nichos/nichos.js"></script>
<script>
const { P, W, H, VERT } = EST;
escena({ duracion: P.duracion, ancho: W, alto: H, fondo: 'marca' }, (MG) => {
  const N = NICHOS(MG), { k, C, lerp } = N, fin = P.duracion - 1.1, cw = W - (VERT ? 120 : 220);
  const furgo = MG.el(`<div class="furgo"><svg viewBox="0 0 260 150"><rect x="6" y="20" width="150" height="92" rx="14" fill="var(--acento)"/>
    <path d="M156 46h52l34 34v32H156z" fill="var(--brillo, var(--acento2))"/><path d="M166 56h38l26 26h-64z" fill="rgba(var(--fondo-rgb),.7)"/>
    <circle cx="52" cy="116" r="22" fill="var(--texto)"/><circle cx="52" cy="116" r="9" fill="var(--acento)"/><circle cx="200" cy="116" r="22" fill="var(--texto)"/><circle cx="200" cy="116" r="9" fill="var(--acento)"/>
    <text x="80" y="76" text-anchor="middle" font-family="Inter Tight, sans-serif" font-weight="700" font-size="30" fill="#fff">0 €</text></svg></div>`);
  const vels = [0, 1, 2].map(() => MG.el(`<div class="vel"></div>`));
  const tit = N.frase(P.titulo, 'n-tit', cw); tit.style.fontSize = (VERT ? 112 : 92) + 'px';
  const cond = MG.el(`<div class="cond" style="width:${cw}px">${P.condicion}</div>`);
  const et = ['horas', 'min', 'seg'];
  const reloj = MG.el(`<div class="reloj" style="width:${W}px">${et.map((e, i) => `${i ? '<span class="dos">:</span>' : ''}<div class="n-card caja"><div class="d"><span></span><span></span></div><small>${e}</small></div>`).join('')}</div>`);
  const cajas = [...reloj.querySelectorAll('.caja')];
  const cod = MG.el(`<div class="cod">Código <b>${P.codigo}</b></div>`);
  const marca = MG.el(N.marca(.8));
  const total = P.horas * 3600 + P.minutos * 60 + P.segundos, dos = (n) => String(n).padStart(2, '0');
  const val = (s) => [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60];
  return (t) => {
    N.vivo(t);
    const y0 = VERT ? 400 : 60;
    // furgoneta: entra desde la izquierda muy rápido (desenfoque) y frena con rebote; sale acelerando a la derecha
    N.es(furgo, t, .1, fin, { x: (W - 520) / 2, y: y0, dx: -1400, dy: 0, curva: 'rebote', d: .7, ox: 1600, oy: 0, dOut: .5 });
    furgo.style.rotate = `${-3 * Math.sin(Math.PI * k(t, .3, .9))}deg`;
    vels.forEach((v, i) => { const p = k(t, .1, 1.0), o = Math.sin(Math.PI * p) * (1 - k(t, fin, fin + .3)) + Math.sin(Math.PI * k(t, fin, fin + .5)); v.style.width = 260 * (o + .001) + 'px'; v.style.opacity = o; MG.pon(v, (W - 520) / 2 - 300 * o, y0 + 80 + i * 60); });
    const yT = y0 + 340; MG.pon(tit, (W - cw) / 2, yT);
    if (t < fin) MG.animaTexto(tit, t, .7, { paso: .08 }); else N.es(tit, t, 0, fin, { x: (W - cw) / 2, y: yT, oy: -100 });
    const yC = yT + tit.offsetHeight + 24;
    N.es(cond, t, 1.2, fin + .08, { x: (W - cw) / 2, y: yC, dy: 50, curva: 'salidaQuint', oy: -80 });
    // reloj real: baja un segundo por segundo; el dígito nuevo cae desde arriba con rebote
    const s = Math.max(0, total - Math.floor(Math.max(0, t - 1.6))), a = val(s), b = val(Math.min(total, s + 1)), fr = Math.max(0, t - 1.6) % 1;
    cajas.forEach((c, i) => { const [n1, n0] = c.querySelectorAll('.d span'); n1.textContent = dos(a[i]); n0.textContent = dos(b[i]);
      const p = a[i] !== b[i] && t > 1.6 ? C.rebote(Math.min(1, fr * 2.2)) : 1; n1.style.transform = `translateY(${(p - 1) * 130}px)`; n0.style.transform = `translateY(${p * 130}px)`; n0.style.opacity = 1 - p; });
    const yR = yC + cond.offsetHeight + 60;
    [...reloj.children].forEach((c, i) => { const e = MG.entra(c, t, 1.4 + i * .08, { dy: 120, curva: 'reboteFuerte', d: .55 }); c.style.transform = `translateY(${e.y}px) scale(${e.s})`; });
    N.es(reloj, t, 0, fin + .15, { x: 0, y: yR, dy: 0, oy: -80 }); if (t < fin + .15) reloj.style.opacity = 1;
    N.es(cod, t, 2.6, fin + .25, { x: N.cx(cod), y: yR + 290, dy: 80, curva: 'reboteSuave', oy: -60 });
    N.es(marca, t, 2.9, fin + .32, { x: N.cx(marca), y: H - (VERT ? 200 : 70), dy: 50, oy: -40 });
  };
});
</script>
</body></html>
