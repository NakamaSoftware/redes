<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Plantilla genérica «gen-encuesta» · Cualquier creador · Viegas IA · Motion Lab
     Pregunta para los comentarios: la pregunta entra por palabras, las opciones A/B (o más) llegan cada una con su curva, un cursor
     toca una opción y las barras de porcentaje se llenan (salidaQuint) mientras los números cuentan. Cierra con «Responde en comentarios».
     Cambia "pregunta" (*palabra* = acento), "opciones" ([texto, %]), "elegida", "cierre", "marca". Formato: #9x16 · #4x5 · #1x1 · Paleta: "noche" | "claro". -->
<link rel="stylesheet" href="../motor/estilo.css">
<link rel="stylesheet" href="../motor/temas/noche-azul.css">
<link rel="stylesheet" href="_nichos/nichos.css">
<script src="../motor/motor.js"></script>
<style>
.op{ position:relative; overflow:hidden; display:flex; align-items:center; gap:24px; padding:34px 36px; }
.op .relleno{ position:absolute; left:0; top:0; bottom:0; background:rgba(var(--halo),.22); transform-origin:0 50%; }
.op.on .relleno{ background:rgba(var(--halo),.42); }
.op .l{ position:relative; width:64px; height:64px; border-radius:18px; display:grid; place-items:center; font:600 32px var(--mono); color:var(--texto); background:rgba(var(--claro),.1); flex:none; }
.op.on .l{ background:var(--acento); color:#fff; }
.op .tx{ position:relative; font:600 46px var(--fuente); color:var(--texto); letter-spacing:-.02em; }
.op .pc{ position:relative; margin-left:auto; font:600 44px var(--fuente); color:var(--texto); font-variant-numeric:tabular-nums; }
.cursor{ width:90px; height:90px; }
.cierre{ display:flex; align-items:center; gap:14px; font:500 40px var(--fuente); color:var(--texto); }
.cierre svg{ width:50px; height:50px; }
</style>
</head><body>
<script id="params" type="application/json">
{
  "formato": "9x16",
  "duracion": 8,
  "paleta": "noche",
  "acento": "",
  "etiqueta": "Encuesta rápida",
  "pregunta": "¿Qué te frena más a *publicar*?",
  "opciones": [["La falta de tiempo", 46], ["No saber qué decir", 31], ["Salir en cámara", 23]],
  "elegida": 0,
  "cierre": "Dímelo en comentarios",
  "marca": "Tu Marca",
  "logo": ""
}
</script>
<script src="../motor/estilos.js"></script>
<script src="_nichos/nichos.js"></script>
<script>
const { P, W, H, VERT } = EST;
escena({ duracion: P.duracion, ancho: W, alto: H, fondo: 'marca' }, (MG) => {
  const N = NICHOS(MG), { k, C, lerp } = N, fin = P.duracion - 1.1, cw = W - (VERT ? 120 : 300);
  const chip = MG.el(`<div class="n-chip"><i></i>${P.etiqueta}</div>`);
  const preg = N.frase(P.pregunta, 'n-tit', cw);
  const ops = P.opciones.map(([tx], i) => MG.el(`<div class="n-card op" style="width:${cw}px"><span class="relleno"></span><span class="l">${'ABCD'[i]}</span><span class="tx">${tx}</span><span class="pc"></span></div>`));
  const cur = MG.el(`<div class="cursor"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg></div>`);
  const cierre = MG.el(`<div class="cierre"><svg viewBox="0 0 24 24" fill="none" stroke="var(--acento)" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1.1-4.6A8 8 0 1121 12z"/></svg>${P.cierre}</div>`);
  const marca = MG.el(N.marca(.8));
  const curvas = ['rebote', 'reboteFuerte', 'reboteSuave', 'rebote'], tToque = 1.4 + ops.length * .2 + .6;
  let L;
  return (t) => {
    if (!L) { const ho = ops[0].offsetHeight, g = 22, tot = 110 + preg.offsetHeight + 60 + ops.length * (ho + g) + 40 + 60; L = { y: (H - tot) / 2, ho, g }; }
    N.vivo(t);
    N.es(chip, t, .05, fin, { x: N.cx(chip), y: L.y, dy: -60, curva: 'salidaQuint', oy: -60 });
    const yP = L.y + 110; MG.pon(preg, (W - cw) / 2, yP);
    if (t < fin) MG.animaTexto(preg, t, .2, { paso: .08 }); else N.es(preg, t, 0, fin, { x: (W - cw) / 2, y: yP, oy: -100 });
    const y0 = yP + preg.offsetHeight + 60, x0 = (W - cw) / 2;
    ops.forEach((o, i) => {
      N.es(o, t, 1.4 + i * .2, fin + .08 + i * .05, { x: x0, y: y0 + i * (L.ho + L.g), dx: i % 2 ? 300 : -300, dy: 0, curva: curvas[i], d: .6, oy: -90 });
      const p = C.salidaQuint(k(t, tToque + .2, tToque + 1.4)), pct = P.opciones[i][1];
      o.querySelector('.relleno').style.width = '100%'; o.querySelector('.relleno').style.transform = `scaleX(${p * pct / 100})`;
      o.querySelector('.pc').textContent = t > tToque + .2 ? Math.round(p * pct) + ' %' : '';
      o.classList.toggle('on', i === P.elegida && t > tToque);
      if (i === P.elegida) o.style.scale = 1 - .04 * Math.sin(Math.PI * k(t, tToque - .05, tToque + .25));
    });
    // cursor: llega con curva rápida y frenada suave, toca y se va acelerando
    const yo = y0 + P.elegida * (L.ho + L.g) + L.ho / 2, ca = C.salidaQuint(k(t, tToque - .8, tToque)), cs = C.entradaCubica(k(t, tToque + .5, tToque + 1.1));
    MG.pon(cur, lerp(W + 50, x0 + cw * .62, ca) + cs * 500, lerp(H, yo, ca) + cs * 300, 1 - .15 * Math.sin(Math.PI * k(t, tToque - .05, tToque + .25)));
    cur.style.opacity = t > tToque - .8 && t < tToque + 1.1 ? 1 : 0;
    MG.desenfoca(cur, Math.abs(ca - C.salidaQuint(k(t - MG.DT, tToque - .8, tToque))) * 40 + cs * 10, 0);
    N.es(cierre, t, tToque + 1.0, fin + .25, { x: N.cx(cierre), y: y0 + ops.length * (L.ho + L.g) + 40, dy: 60, curva: 'reboteSuave', oy: -60 });
    N.es(marca, t, tToque + 1.2, fin + .32, { x: N.cx(marca), y: H - (VERT ? 200 : 70), dy: 50, oy: -40 });
  };
});
</script>
</body></html>
